<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYCOM 개인 회원가입</title><style>body{margin:0;background:#f7f7f7;font-family:Arial,sans-serif;color:#222}.wrap{max-width:560px;margin:0 auto;background:#fff;min-height:100vh;padding:28px;box-sizing:border-box}h1{margin:0 0 8px}.sub{color:#777;margin-bottom:26px}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:15px}.btn{width:100%;margin-top:20px;padding:16px;border:0;border-radius:14px;background:#18a36b;color:#fff;font-size:16px;font-weight:800;cursor:pointer}.back{display:inline-block;margin-bottom:20px;color:#555;text-decoration:none}.notice{background:#eef8ff;border-radius:14px;padding:14px;font-size:13px;line-height:1.6;color:#31566e}.partner{margin-top:24px;text-align:center;font-size:13px;color:#777}.partner a{color:#08764a;font-weight:800;text-decoration:none}</style></head><body><main class="wrap"><a class="back" href="/">← MYCOM으로 돌아가기</a><h1>👤 개인 회원가입</h1><p class="sub">MYCOM의 AI 상담, 견적, 예약, 내 PC 판매 서비스를 이용하세요.</p><div class="notice">개인 고객은 누구나 이 페이지에서 바로 가입할 수 있습니다.<br>컴퓨터 업체는 별도의 <b>MYCOM 초대 링크</b>가 있어야 가입할 수 있습니다.</div><form id="registerForm"><div class="field"><label>이름</label><input id="name" required></div><div class="field"><label>이메일</label><input id="email" type="email" required></div><div class="field"><label>비밀번호</label><input id="password" type="password" minlength="8" required placeholder="8자 이상"></div><div class="field"><label>휴대폰 번호</label><input id="phone" placeholder="010-0000-0000"></div><button class="btn" id="submitBtn">개인 회원가입</button></form><div class="partner">컴퓨터 업체이신가요?<br>MYCOM에서 발급한 업체 초대 링크를 통해 가입해주세요.</div></main><script>const q=id=>document.getElementById(id);q('registerForm').onsubmit=async e=>{e.preventDefault();q('submitBtn').disabled=true;try{const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:q('name').value.trim(),email:q('email').value.trim(),password:q('password').value,phone:q('phone').value.trim()})});const d=await r.json();if(!r.ok)throw new Error(d.error||'회원가입 실패');if(d.token)localStorage.setItem('mycom_token',d.token);if(d.user)localStorage.setItem('mycom_user',JSON.stringify(d.user));alert(d.message||'회원가입 완료');location.href='/'}catch(err){alert(err.message)}finally{q('submitBtn').disabled=false}};</script></body></html>
