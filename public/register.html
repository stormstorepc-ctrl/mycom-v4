<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYCOM 회원가입</title><style>body{margin:0;background:#f7f7f7;font-family:Arial,sans-serif;color:#222}.wrap{max-width:560px;margin:0 auto;background:#fff;min-height:100vh;padding:28px;box-sizing:border-box}h1{margin:0 0 8px}.sub{color:#777;margin-bottom:26px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}.tab{border:2px solid #eee;background:#fff;border-radius:16px;padding:18px 8px;font-size:16px;font-weight:700;cursor:pointer}.tab.active{border-color:#18a36b;background:#effbf5;color:#08764a}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field textarea{width:100%;box-sizing:border-box;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:15px}.shop-only{display:none}.services{display:flex;flex-wrap:wrap;gap:8px}.services label{background:#f5f5f5;padding:9px 12px;border-radius:20px;font-size:13px}.btn{width:100%;margin-top:20px;padding:16px;border:0;border-radius:14px;background:#18a36b;color:#fff;font-size:16px;font-weight:800;cursor:pointer}.hint{font-size:12px;color:#888;line-height:1.5}.back{display:inline-block;margin-bottom:20px;color:#555;text-decoration:none}</style></head><body><main class="wrap"><a class="back" href="/">← MYCOM으로 돌아가기</a><h1>회원가입</h1><p class="sub">MYCOM에서 필요한 서비스를 선택해주세요.</p><div class="tabs"><button class="tab active" id="customerTab" type="button">👤 일반 고객</button><button class="tab" id="shopTab" type="button">🏪 컴퓨터 업체</button></div><form id="registerForm"><div class="field"><label>이름 / 담당자명</label><input id="name" required></div><div class="field"><label>이메일</label><input id="email" type="email" required></div><div class="field"><label>비밀번호</label><input id="password" type="password" minlength="8" required></div><div class="field"><label>휴대폰 번호</label><input id="phone" placeholder="010-0000-0000"></div><section class="shop-only" id="shopFields"><hr><h3>🏪 업체 정보</h3><div class="field"><label>업체명</label><input id="shop_name"></div><div class="field"><label>사업자등록번호</label><input id="business_number" placeholder="000-00-00000"></div><div class="field"><label>매장 주소</label><input id="address" placeholder="시/도, 시/군/구"></div><div class="field"><label>상세 주소</label><input id="detail_address"></div><div class="field"><label>매장 전화번호</label><input id="shop_phone"></div><div class="field"><label>매장 소개</label><textarea id="description" rows="3" placeholder="조립 PC, 수리, 중고 매입 등"></textarea></div><div class="field"><label>제공 서비스</label><div class="services"><label><input type="checkbox" value="조립PC"> 조립PC</label><label><input type="checkbox" value="PC수리"> PC수리</label><label><input type="checkbox" value="중고매입"> 중고매입</label><label><input type="checkbox" value="출장서비스"> 출장서비스</label><label><input type="checkbox" value="부품판매"> 부품판매</label></div></div><p class="hint">업체 가입 후 관리자 승인 전까지 일부 파트너 기능이 제한될 수 있습니다.</p></section><button class="btn" id="submitBtn">일반 회원가입</button></form></main><script>let mode='user';const q=id=>document.getElementById(id);function setMode(m){mode=m;q('customerTab').classList.toggle('active',m==='user');q('shopTab').classList.toggle('active',m==='shop');q('shopFields').style.display=m==='shop'?'block':'none';q('submitBtn').textContent=m==='shop'?'컴퓨터 업체 가입하기':'일반 회원가입'}q('customerTab').onclick=()=>setMode('user');q('shopTab').onclick=()=>setMode('shop');q('registerForm').onsubmit=async e=>{e.preventDefault();const base={name:q('name').value.trim(),email:q('email').value.trim(),password:q('password').value,phone:q('phone').value.trim()};let url='/api/auth/register',body={...base,role:'user'};if(mode==='shop'){for(const id of ['shop_name','business_number','address'])if(!q(id).value.trim())return alert('업체 필수 정보를 입력해주세요.');url='/api/auth/register-shop';body={...base,shop_name:q('shop_name').value.trim(),business_number:q('business_number').value.trim(),address:q('address').value.trim(),detail_address:q('detail_address').value.trim(),shop_phone:q('shop_phone').value.trim(),description:q('description').value.trim()};body.services=[...document.querySelectorAll('.services input:checked')].map(x=>x.value)}q('submitBtn').disabled=true;try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error||'회원가입 실패');if(d.token)localStorage.setItem('mycom_token',d.token);if(d.user)localStorage.setItem('mycom_user',JSON.stringify(d.user));alert(d.message||'회원가입 완료');location.href=mode==='shop'?'/partner.html':'/'}catch(err){alert(err.message)}finally{q('submitBtn').disabled=false}}</script></body></html>
