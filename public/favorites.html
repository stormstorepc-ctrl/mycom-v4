<!doctype html><html lang="ko"><head><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css"><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css"><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYCOM | 찜한 매장</title><style>body{margin:0;background:#F4F6F8;color:#16181C;font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif'Noto Sans KR',sans-serif}.wrap{max-width:720px;margin:auto;padding:18px}.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}.back,.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:800;background:#fff}.title{flex:1}.card{background:#fff;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 5px 18px #16181C08}.name{font-size:18px;font-weight:900}.muted{font-size:13px;color:#6B7684;line-height:1.5}.primary{background:#1F6FE5;color:#fff}.danger{background:#FDECF4;color:#D6006C}.empty{text-align:center;padding:55px 18px}</style></head><body><main class="wrap"><header class="top"><button class="back" onclick="history.length>1?history.back():location.href='/'">←</button><div class="title"><h2 style="margin:0"><i class="ph ph-heart"></i> 찜한 매장</h2><div class="muted">관심 있는 MYCOM 업체를 모아볼 수 있습니다.</div></div></header><div id="app" class="card">불러오는 중...</div></main><script>const token=localStorage.getItem('mycom_token')||localStorage.getItem('token');const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){if(!token){app.innerHTML='<div class="empty"><i class="ph ph-lock-key"></i><h3>로그인이 필요합니다.</h3><button class="btn primary" onclick="location.href=\'/\'">로그인하기</button></div>';return}try{const r=await fetch('/api/favorites',{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok)throw Error(d.error||'조회 실패');const a=d.favorites||[];app.innerHTML=a.length?a.map(s=>`<article class="card"><div class="name"><i class="ph ph-storefront"></i> ${esc(s.shop_name)}</div><div class="muted" style="margin:7px 0">⭐ ${Number(s.rating||0).toFixed(1)} · 리뷰 ${s.review_count||0}개<br><i class="ph-fill ph-map-pin"></i> ${esc(s.address||'')} ${esc(s.detail_address||'')}<br><i class="ph ph-phone"></i> ${esc(s.phone||'')}</div><div style="display:flex;gap:8px"><button class="btn primary" style="flex:1" onclick="location.href='/shop.html?id=${encodeURIComponent(s.id)}'">매장 보기</button><button class="btn danger" onclick="removeFav('${s.id}')">찜 해제</button></div></article>`).join(''):'<div class="empty"><i class="ph ph-heart"></i><h3>찜한 매장이 없습니다.</h3><p class="muted">마음에 드는 매장의 <i class="ph ph-heart"></i> 버튼을 눌러 추가해보세요.</p><button class="btn primary" onclick="location.href='/'">매장 찾아보기</button></div>'}catch(e){app.innerHTML='<div class="empty">오류가 발생했습니다.<br>'+esc(e.message)+'</div>'}}async function removeFav(id){try{const r=await fetch('/api/favorites/'+encodeURIComponent(id),{method:'DELETE',headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error('찜 해제 실패');load()}catch(e){alert(e.message)}}load();</script></body></html>
