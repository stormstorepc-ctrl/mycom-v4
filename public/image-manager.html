<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYCOM 이미지 스튜디오</title><style>body{margin:0;background:#f4f6f8;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#17202a}.app{max-width:760px;margin:auto;padding:20px}.hero{background:linear-gradient(135deg,#101828,#12b886);color:#fff;border-radius:24px;padding:24px}.hero h1{margin:0 0 8px;font-size:27px}.card{background:#fff;border-radius:20px;padding:18px;margin-top:16px;box-shadow:0 8px 24px #0000000d}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.tab{border:0;border-radius:12px;padding:11px 5px;background:#f1f3f5;font-weight:800}.tab.on{background:#12b886;color:#fff}label{display:block;font-size:13px;font-weight:800;margin:14px 0 6px}input,textarea,select{width:100%;box-sizing:border-box;border:1px solid #dfe3e7;border-radius:12px;padding:12px;font:inherit}textarea{min-height:90px}.generate{width:100%;margin-top:15px;border:0;border-radius:14px;padding:15px;background:#17202a;color:#fff;font-size:16px;font-weight:900}.hint{font-size:12px;color:#6b7280;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.img{background:#fff;border-radius:15px;overflow:hidden}.img img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.img div{padding:10px;font-size:12px;font-weight:700}@media(max-width:500px){.tabs{grid-template-columns:repeat(2,1fr)}.app{padding:14px}}</style></head><body><main class="app"><section class="hero"><h1>🎨 MYCOM 이미지 스튜디오</h1><div>NovelAI로 MYCOM 전용 이미지를 생성하고 앱 전체에서 재사용합니다.</div></section><section class="card"><div class="tabs"><button class="tab on" data-c="menu">메인 메뉴</button><button class="tab" data-c="ai">AI 상담</button><button class="tab" data-c="shop">업체 기본</button><button class="tab" data-c="banner">이벤트/배너</button></div><label>이미지 제목</label><input id="title" placeholder="예: 게이밍 PC 견적"><label>원하는 이미지 설명</label><textarea id="prompt" placeholder="예: 미래적인 고성능 게이밍 PC, RGB 조명, 깔끔한 3D 일러스트"></textarea><p class="hint" id="hint">선택한 용도에 맞는 MYCOM 스타일 프롬프트가 자동으로 앞에 추가됩니다.</p><button class="generate" id="go">✨ NovelAI 이미지 생성</button><p class="hint">API 토큰은 브라우저가 아닌 Render 서버의 NOVELAI_API_TOKEN 환경변수에서만 사용됩니다.</p></section><section class="card"><h2 style="margin-top:0;font-size:19px">최근 생성 이미지</h2><div id="gallery" class="grid"><div class="hint">불러오는 중...</div></div></section></main><script>let category='menu';const token=localStorage.getItem('mycom_token')||localStorage.getItem('token');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');category=b.dataset.c});async function load(){const r=await fetch('/api/images');const d=await r.json();gallery.innerHTML=(d.images||[]).map(x=>`<div class="img"><img src="${x.image_url}" alt=""><div>${x.title||x.category}<br><small>${x.category}</small></div></div>`).join('')||'<div class="hint">아직 생성된 이미지가 없습니다.</div>'}go.onclick=async()=>{if(!token)return alert('최고 관리자 로그인이 필요합니다.');const btn=go;btn.disabled=true;btn.textContent='⏳ NovelAI 생성 중...';try{const r=await fetch('/api/images/generate',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({category,title:title.value,prompt:prompt.value})});const d=await r.json();if(!r.ok)throw new Error(d.detail||d.error);alert('이미지가 생성되었습니다.');await load()}catch(e){alert(e.message)}finally{btn.disabled=false;btn.textContent='✨ NovelAI 이미지 생성'}};load();</script></body></html>
