<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYCOM 이미지 스튜디오</title><style>body{margin:0;background:#f4f6f8;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#17202a}.app{max-width:760px;margin:auto;padding:20px}.hero{background:linear-gradient(135deg,#101828,#12b886);color:#fff;border-radius:24px;padding:24px}.hero h1{margin:0 0 8px;font-size:27px}.card{background:#fff;border-radius:20px;padding:18px;margin-top:16px;box-shadow:0 8px 24px #0000000d}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.tab{border:0;border-radius:12px;padding:11px 5px;background:#f1f3f5;font-weight:800}.tab.on{background:#12b886;color:#fff}label{display:block;font-size:13px;font-weight:800;margin:14px 0 6px}input,textarea{width:100%;box-sizing:border-box;border:1px solid #dfe3e7;border-radius:12px;padding:12px;font:inherit}textarea{min-height:90px}.generate,.starter{width:100%;margin-top:12px;border:0;border-radius:14px;padding:15px;color:#fff;font-size:16px;font-weight:900}.generate{background:#17202a}.starter{background:#12b886}.hint{font-size:12px;color:#6b7280;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.img{background:#fff;border-radius:15px;overflow:hidden}.img img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.img div{padding:10px;font-size:12px;font-weight:700}@media(max-width:500px){.tabs{grid-template-columns:repeat(2,1fr)}.app{padding:14px}}</style></head><body><main class="app"><section class="hero"><h1>🎨 MYCOM 이미지 스튜디오</h1><div>MYCOM 전용 이미지 생성 → 자동 저장 → 메인 화면 적용</div></section><section class="card"><b>🚀 처음이라면 이 버튼부터</b><p class="hint">메인 서비스 6개, AI 상담, 업체 기본 이미지, 이벤트 배너를 MYCOM 스타일로 자동 생성합니다. 이미 있는 이미지는 다시 만들지 않습니다.</p><button class="starter" id="starter">✨ MYCOM 기본 이미지 세트 생성</button></section><section class="card"><div class="tabs"><button class="tab on" data-c="menu">메인 메뉴</button><button class="tab" data-c="ai">AI 상담</button><button class="tab" data-c="shop">업체 기본</button><button class="tab" data-c="banner">이벤트/배너</button></div><label>이미지 제목</label><input id="title" placeholder="예: 게이밍 PC 견적"><label>원하는 이미지 설명</label><textarea id="prompt" placeholder="예: 미래적인 고성능 게이밍 PC, RGB 조명, 프리미엄 3D 일러스트"></textarea><p class="hint">MYCOM 스타일 프롬프트가 자동으로 추가됩니다.</p><button class="generate" id="go">✨ 이미지 1장 생성</button></section><section class="card"><h2 style="margin-top:0;font-size:19px">최근 생성 이미지</h2><div id="gallery" class="grid"><div class="hint">불러오는 중...</div></div></section></main><script>let category='menu';const token=localStorage.getItem('mycom_token')||localStorage.getItem('token');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');category=b.dataset.c});async function load(){const r=await fetch('/api/images');const d=await r.json();gallery.innerHTML=(d.images||[]).map(x=>`<div class="img"><img src="${x.image_url}" alt=""><div>${x.title||x.category}<br><small>${x.category}</small></div></div>`).join('')||'<div class="hint">아직 생성된 이미지가 없습니다.</div>'}async function call(url,body,btn,busy,done){if(!token)return alert('최고 관리자 로그인이 필요합니다.');btn.disabled=true;btn.textContent=busy;try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw new Error(d.detail||d.error);alert(d.message||done);await load()}catch(e){alert(e.message)}finally{btn.disabled=false;btn.textContent=done}}go.onclick=()=>call('/api/images/generate',{category,title:title.value,prompt:prompt.value},go,'⏳ NovelAI 생성 중...','✨ 이미지 1장 생성');starter.onclick=()=>{if(!confirm('MYCOM 기본 이미지 세트를 생성할까요? 이미지가 여러 장이라 1~2분 정도 걸릴 수 있습니다.'))return;call('/api/images/starter-pack',null,starter,'⏳ MYCOM 이미지 세트 생성 중...','✨ MYCOM 기본 이미지 세트 생성')};load();</script></body></html>
