<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYCOM PC 판매</title><style>body{margin:0;background:#f6f7f8;font-family:Pretendard,Arial,sans-serif;color:#191f28}.wrap{max-width:560px;margin:auto;padding:18px 16px 40px}.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}.back{border:0;border-radius:12px;padding:10px 13px}.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button{flex:1;padding:14px;border:0;border-radius:15px;background:#e9ecef;font-weight:900}.tabs button.on{background:#12b886;color:#fff}.card{background:#fff;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 5px 20px #0000000b}label{display:block;font-size:13px;font-weight:800;margin:12px 0 7px}input,select,textarea{width:100%;box-sizing:border-box;border:1px solid #dee2e6;border-radius:12px;padding:12px;background:#fff}textarea{min-height:90px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.photos label{margin:0;border:1px dashed #adb5bd;border-radius:12px;padding:12px 4px;text-align:center;font-size:11px}.photos input{display:none}.thumb{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;margin-top:5px}.submit{width:100%;padding:16px;border:0;border-radius:15px;background:#12b886;color:#fff;font-weight:900;font-size:16px}.hint{font-size:12px;color:#6b7684;line-height:1.6}.hidden{display:none}</style></head><body><main class="wrap"><div class="top"><button class="back" onclick="history.back()">←</button><div><b style="font-size:22px">PC 판매</b><div class="hint">AI 상담 없이 바로 업체 입찰을 받아보세요.</div></div></div><div class="tabs"><button class="on" id="pcTab" onclick="kind('pc')">🖥️ 완본체 판매</button><button id="partTab" onclick="kind('part')">🧩 부품 판매</button></div><section id="pcForm" class="card"><h3>컴퓨터 사양</h3><div class="grid"><div><label>CPU</label><input id="cpu" placeholder="예: Ryzen 7 7800X3D"></div><div><label>그래픽카드</label><input id="gpu" placeholder="예: RTX 5070 Ti"></div><div><label>메인보드</label><input id="motherboard" placeholder="예: B650M"></div><div><label>메모리</label><input id="ram" placeholder="예: DDR5 32GB"></div><div><label>SSD / HDD</label><input id="storage" placeholder="예: NVMe 1TB"></div><div><label>파워</label><input id="power" placeholder="예: 850W Gold"></div><div><label>CPU 쿨러</label><input id="cooler" placeholder="예: 공랭/수랭 모델"></div><div><label>케이스</label><input id="case" placeholder="케이스 모델명"></div></div><label>상태</label><select id="condition"><option value="excellent">최상</option><option value="good" selected>좋음</option><option value="fair">보통</option><option value="poor">사용감 많음</option></select><label>제목</label><input id="title" placeholder="예: RTX 5070 Ti 게이밍 PC 판매합니다"><label>설명</label><textarea id="desc" placeholder="구매시기, 사용기간, 하자, 구성품 등을 입력하세요."></textarea><label>컴퓨터 실물 사진</label><div class="photos" id="pcPhotos"><label>정면<input type="file" accept="image/*" data-photo="정면"></label><label>후면<input type="file" accept="image/*" data-photo="후면"></label><label>왼쪽<input type="file" accept="image/*" data-photo="왼쪽"></label><label>오른쪽<input type="file" accept="image/*" data-photo="오른쪽"></label><label>내부<input type="file" accept="image/*" data-photo="내부"></label><label>부품<input type="file" accept="image/*" data-photo="부품"></label><label>라벨<input type="file" accept="image/*" data-photo="라벨"></label><label>추가<input type="file" accept="image/*" data-photo="추가"></label></div></section><section id="partForm" class="card hidden"><h3>부품 정보</h3><label>부품 카테고리</label><select id="category"><option>CPU</option><option>그래픽카드</option><option>메인보드</option><option>메모리</option><option>SSD</option><option>HDD</option><option>파워</option><option>CPU 쿨러</option><option>케이스</option><option>모니터</option><option>기타</option></select><label>모델명 직접 입력</label><input id="model" placeholder="예: RTX 5070 Ti 16GB"><label>상세 설명</label><textarea id="partDesc" placeholder="사용기간, 상태, 구성품, 영수증/보증 등을 입력하세요."></textarea><label>실물 부품 사진</label><div class="photos" id="partPhotos"><label>정면<input type="file" accept="image/*" data-photo="정면"></label><label>후면<input type="file" accept="image/*" data-photo="후면"></label><label>왼쪽<input type="file" accept="image/*" data-photo="왼쪽"></label><label>오른쪽<input type="file" accept="image/*" data-photo="오른쪽"></label><label>라벨<input type="file" accept="image/*" data-photo="라벨"></label><label>단자<input type="file" accept="image/*" data-photo="단자"></label><label>구성품<input type="file" accept="image/*" data-photo="구성품"></label><label>추가<input type="file" accept="image/*" data-photo="추가"></label></div></section><section class="card"><label>희망 판매가(선택)</label><input id="price" type="number" placeholder="0"><p class="hint">등록하면 승인된 업체들이 입찰할 수 있으며 메인화면의 실시간 인기 입찰에도 자동 반영됩니다.</p></section><button class="submit" onclick="submitSell()">🚀 판매 등록하고 업체 입찰 받기</button></main><script>let saleKind='pc';function kind(k){saleKind=k;pcForm.classList.toggle('hidden',k!=='pc');partForm.classList.toggle('hidden',k!=='part');pcTab.classList.toggle('on',k==='pc');partTab.classList.toggle('on',k==='part')}function readFiles(root){return Promise.all([...document.querySelectorAll(root+' input[type=file]')].filter(x=>x.files[0]).map(x=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),max=1400,scale=Math.min(1,max/Math.max(im.width,im.height));c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve({angle:x.dataset.photo,data:c.toDataURL('image/jpeg',.78)})};im.onerror=reject;im.src=r.result};r.onerror=reject;r.readAsDataURL(x.files[0])}))}async function submitSell(){const token=localStorage.getItem('mycom_token')||localStorage.getItem('token');if(!token){alert('로그인 후 판매 등록이 가능합니다.');return}try{const images=await readFiles(saleKind==='pc'?'#pcPhotos':'#partPhotos');let body={quote_type:'sell',title:'',description:'',budget_max:Number(price.value)||null,expires_at:new Date(Date.now()+7*86400000).toISOString()};if(saleKind==='pc'){body.title=title.value.trim()||'컴퓨터 완본체 판매';body.description=desc.value;body.pc={title:body.title,cpu:cpu.value,gpu:gpu.value,motherboard:motherboard.value,ram:ram.value,storage:storage.value,power_supply:power.value,cooler:cooler.value,pc_case:document.getElementById('case').value,condition_grade:condition.value,description:desc.value,images:images.map(x=>x.data)}}else{body.title=(model.value.trim()||category.value)+' 부품 판매';body.part={category:category.value,model:model.value,description:partDesc.value,images:images.map(x=>x.data)}}const r=await fetch('/api/quotes',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error||'등록 실패');alert('판매 등록이 완료되었습니다. 업체 입찰을 기다려주세요.');location.href='/index.html'}catch(e){alert(e.message)}}</script></body></html>
