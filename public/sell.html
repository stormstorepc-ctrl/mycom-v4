<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYCOM PC 판매</title><style>body{margin:0;background:#f6f7f8;font-family:Pretendard,Arial,sans-serif;color:#191f28}.wrap{max-width:680px;margin:auto;padding:18px 16px 50px}.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}.back{border:0;border-radius:12px;padding:10px 13px}.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button{flex:1;padding:14px;border:0;border-radius:15px;background:#e9ecef;font-weight:900}.tabs button.on{background:#12b886;color:#fff}.card{background:#fff;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 5px 20px #0000000b}label{display:block;font-size:13px;font-weight:800;margin:12px 0 7px}input,select,textarea{width:100%;box-sizing:border-box;border:1px solid #dee2e6;border-radius:12px;padding:12px;background:#fff}textarea{min-height:90px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.photos label{margin:0;border:1px dashed #adb5bd;border-radius:12px;padding:12px 4px;text-align:center;font-size:11px;cursor:pointer}.photos input{display:none}.preview{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}.preview img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}.submit{width:100%;padding:16px;border:0;border-radius:15px;background:#12b886;color:#fff;font-weight:900;font-size:16px}.submit:disabled{opacity:.55}.hint{font-size:12px;color:#6b7684;line-height:1.6}.hidden{display:none}.required{color:#e03131}.msg{display:none;margin-top:12px;padding:12px;border-radius:12px;background:#fff3bf;font-size:13px}.busy{display:none;text-align:center;padding:10px;font-weight:800}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><button class="back" type="button" onclick="history.back()">←</button><div><b style="font-size:22px">PC 판매</b><div class="hint">완본체 또는 부품을 등록하고 승인된 업체의 매입 입찰을 받아보세요.</div></div></div><div class="tabs"><button type="button" class="on" id="pcTab">🖥️ 완본체 판매</button><button type="button" id="partTab">🧩 부품 판매</button></div><section id="pcForm" class="card"><h3>컴퓨터 사양</h3><div class="grid"><div><label>CPU</label><input id="pcCpu" placeholder="예: Ryzen 7 7800X3D"></div><div><label>그래픽카드</label><input id="pcGpu" placeholder="예: RTX 5070 Ti"></div><div><label>메인보드</label><input id="pcMotherboard" placeholder="예: B650M"></div><div><label>메모리</label><input id="pcRam" placeholder="예: DDR5 32GB"></div><div><label>SSD / HDD</label><input id="pcStorage" placeholder="예: NVMe 1TB"></div><div><label>파워</label><input id="pcPower" placeholder="예: 850W Gold"></div><div><label>CPU 쿨러</label><input id="pcCooler" placeholder="예: 공랭/수랭 모델"></div><div><label>케이스</label><input id="pcCase" placeholder="케이스 모델명"></div></div><label>상태</label><select id="pcCondition"><option value="excellent">최상</option><option value="good" selected>좋음</option><option value="fair">보통</option><option value="poor">사용감 많음</option></select><label>제목 <span class="required">*</span></label><input id="pcTitle" placeholder="예: RTX 5070 Ti 게이밍 PC 판매합니다"><label>설명</label><textarea id="pcDesc" placeholder="구매시기, 사용기간, 하자, 구성품 등을 입력하세요."></textarea><label>컴퓨터 실물 사진</label><div class="photos" id="pcPhotos"><label>정면<input type="file" accept="image/*"></label><label>후면<input type="file" accept="image/*"></label><label>왼쪽<input type="file" accept="image/*"></label><label>오른쪽<input type="file" accept="image/*"></label><label>내부<input type="file" accept="image/*"></label><label>부품<input type="file" accept="image/*"></label><label>라벨<input type="file" accept="image/*"></label><label>추가<input type="file" accept="image/*"></label></div><div class="preview" id="pcPreview"></div></section><section id="partForm" class="card hidden"><h3>부품 정보</h3><label>부품 카테고리</label><select id="partCategory"><option>CPU</option><option>그래픽카드</option><option>메인보드</option><option>메모리</option><option>SSD</option><option>HDD</option><option>파워</option><option>CPU 쿨러</option><option>케이스</option><option>모니터</option><option>기타</option></select><label>정확한 모델명 <span class="required">*</span></label><input id="partModel" placeholder="예: MSI RTX 5070 Ti GAMING X TRIO 16G"><label>상태</label><select id="partCondition"><option value="excellent">최상</option><option value="good" selected>좋음</option><option value="fair">보통</option><option value="poor">사용감 많음</option></select><label>상세 설명</label><textarea id="partDesc" placeholder="사용기간, 상태, 구성품, 영수증/보증 등을 입력하세요."></textarea><label>실물 부품 사진</label><div class="photos" id="partPhotos"><label>정면<input type="file" accept="image/*"></label><label>후면<input type="file" accept="image/*"></label><label>왼쪽<input type="file" accept="image/*"></label><label>오른쪽<input type="file" accept="image/*"></label><label>라벨<input type="file" accept="image/*"></label><label>단자<input type="file" accept="image/*"></label><label>구성품<input type="file" accept="image/*"></label><label>추가<input type="file" accept="image/*"></label></div><div class="preview" id="partPreview"></div></section><section class="card"><label>희망 판매가(선택)</label><input id="salePrice" type="number" min="0" step="1000" placeholder="0"><p class="hint">판매 등록 후 7일 동안 업체 입찰을 받습니다.</p></section><div id="message" class="msg"></div><div id="busy" class="busy">판매 정보를 등록하는 중입니다…</div><button id="submitBtn" class="submit" type="button">🚀 판매 등록하고 업체 입찰 받기</button></main><script>(function(){'use strict';let saleKind='pc';const $=id=>document.getElementById(id);const token=()=>localStorage.getItem('mycom_token')||localStorage.getItem('token')||localStorage.getItem('accessToken')||'';function msg(t){const e=$('message');e.textContent=t;e.style.display='block'}function setKind(k){saleKind=k;$('pcForm').classList.toggle('hidden',k!=='pc');$('partForm').classList.toggle('hidden',k!=='part');$('pcTab').classList.toggle('on',k==='pc');$('partTab').classList.toggle('on',k==='part')}$('pcTab').onclick=()=>setKind('pc');$('partTab').onclick=()=>setKind('part');function fileData(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const max=1000,s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.55))};im.onerror=reject;im.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}function setupPhotos(rootId,outId){const root=$(rootId),out=$(outId);root.addEventListener('change',async()=>{out.innerHTML='';const inputs=[...root.querySelectorAll('input[type=file]')];for(const input of inputs){if(!input.files[0])continue;const img=document.createElement('img');img.src=URL.createObjectURL(input.files[0]);out.appendChild(img)}})}setupPhotos('pcPhotos','pcPreview');setupPhotos('partPhotos','partPreview');async function getImages(rootId){const files=[...$(rootId).querySelectorAll('input[type=file]')].map(x=>x.files&&x.files[0]).filter(Boolean);if(files.length>8)throw Error('사진은 최대 8장까지 선택할 수 있습니다.');const result=[];for(const f of files){if(!f.type.startsWith('image/'))continue;result.push(await fileData(f))}return result}async function submit(){const t=token();if(!t){msg('로그인이 필요합니다. 먼저 로그인해 주세요.');return}const btn=$('submitBtn');btn.disabled=true;$('busy').style.display='block';$('message').style.display='none';try{const images=await getImages(saleKind==='pc'?'pcPhotos':'partPhotos');const price=Number($('salePrice').value)||null;const body={quote_type:'sell',title:'',description:'',budget_min:null,budget_max:price,expires_at:new Date(Date.now()+7*86400000).toISOString()};if(saleKind==='pc'){const title=$('pcTitle').value.trim();if(!title){msg('판매 제목을 입력해 주세요.');return}body.title=title;body.description=$('pcDesc').value.trim();body.pc={title,cpu:$('pcCpu').value.trim(),gpu:$('pcGpu').value.trim(),motherboard:$('pcMotherboard').value.trim(),ram:$('pcRam').value.trim(),storage:$('pcStorage').value.trim(),power_supply:$('pcPower').value.trim(),cooler:$('pcCooler').value.trim(),pc_case:$('pcCase').value.trim(),condition_grade:$('pcCondition').value,description:body.description,images}}else{const model=$('partModel').value.trim();if(!model){msg('부품 정확한 모델명을 입력해 주세요.');return}body.title=model+' 부품 판매';body.description=$('partDesc').value.trim();body.part={sale_kind:'part',category:$('partCategory').value,model,condition_grade:$('partCondition').value,description:body.description,images}}const r=await fetch('/api/quotes',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(r.status===401||r.status===403){msg('로그인이 만료되었습니다. 다시 로그인해 주세요.');return}if(!r.ok)throw Error(d.error||'판매 등록에 실패했습니다.');msg('판매 등록이 완료되었습니다. 업체 입찰을 기다려 주세요.');setTimeout(()=>{if(document.referrer)history.back();},900)}catch(e){console.error(e);msg(e.message||'판매 등록 중 오류가 발생했습니다.')}finally{btn.disabled=false;$('busy').style.display='none'}}$('submitBtn').onclick=submit})();</script></body></html>
