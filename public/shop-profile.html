<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYCOM 업체 정보 관리</title><style>body{margin:0;background:#f5f7f8;font-family:Arial,sans-serif;color:#191f28}.wrap{max-width:760px;margin:auto;background:#fff;min-height:100vh;padding:24px;box-sizing:border-box}.card{background:#fff;border:1px solid #e9ecef;border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:0 6px 20px rgba(0,0,0,.04)}h1{font-size:24px}label{display:block;font-weight:800;font-size:13px;margin:14px 0 7px}input,textarea{width:100%;box-sizing:border-box;border:1px solid #ddd;border-radius:12px;padding:13px;font:inherit}textarea{min-height:100px}.btn{border:0;border-radius:12px;padding:13px 16px;background:#12b886;color:#fff;font-weight:800;cursor:pointer}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.photo{position:relative}.photo img{width:100%;aspect-ratio:1;border-radius:14px;object-fit:cover}.del{position:absolute;right:5px;top:5px;border:0;border-radius:50%;width:28px;height:28px;background:#fff}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{background:#f1f3f5;border-radius:20px;padding:8px 11px}</style></head><body><main class="wrap"><h1>🏪 업체 정보 관리</h1><p>고객에게 보여줄 매장 사진과 업체 정보를 관리하세요.</p><section class="card"><label>업체명</label><input id="shop_name"><label>한줄 소개</label><input id="short_description" maxlength="300"><label>상세 소개</label><textarea id="description"></textarea><label>주소</label><input id="address"><label>상세 주소</label><input id="detail_address"><label>전화번호</label><input id="phone"><label>영업시간</label><input id="business_hours" placeholder="예: 평일 10:00~20:00 / 일요일 휴무"><label>서비스 (쉼표로 구분)</label><input id="services" placeholder="조립, 수리, 중고PC, 출장, 견적"><br><br><button class="btn" onclick="save()">정보 저장</button></section><section class="card"><h3>📷 매장 사진</h3><p>간판, 매장 내부, 작업 모습, 완성 PC 등을 올려주세요. 최대 8MB.</p><input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple><div id="gallery" class="gallery"></div></section></main><script>const token=localStorage.getItem('mycom_token')||localStorage.getItem('token');let shop=null;async function load(){if(!token)return location.href='/login.html';const r=await fetch('/api/shops/my',{headers:{Authorization:'Bearer '+token}});if(!r.ok){alert('업체 정보를 불러오지 못했습니다.');return}shop=(await r.json()).shop;['shop_name','short_description','description','address','detail_address','phone','business_hours'].forEach(k=>document.getElementById(k).value=shop[k]||'');document.getElementById('services').value=(shop.services||[]).join(', ');render();}async function save(){const body={};['shop_name','short_description','description','address','detail_address','phone','business_hours'].forEach(k=>body[k]=document.getElementById(k).value.trim());body.services=document.getElementById('services').value.split(',').map(x=>x.trim()).filter(Boolean);const r=await fetch('/api/shops/'+shop.id,{method:'PUT',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(body)});if(!r.ok)return alert((await r.json()).error||'저장 실패');shop=(await r.json()).shop;alert('저장되었습니다.');}function render(){document.getElementById('gallery').innerHTML=(shop.shop_images||[]).map(u=>`<div class="photo"><img src="${u}"><button class="del" onclick="delPhoto('${u}')">×</button></div>`).join('');}document.getElementById('photos').onchange=async e=>{for(const f of e.target.files){if(f.size>8*1024*1024){alert(f.name+'은 8MB를 초과합니다.');continue}const reader=new FileReader();reader.onload=async()=>{const r=await fetch('/api/shops/'+shop.id+'/photos',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({imageData:reader.result})});if(!r.ok)alert((await r.json()).error||'업로드 실패');else{shop.shop_images=(await r.json()).shop_images;render();}};reader.readAsDataURL(f);}e.target.value='';};async function delPhoto(url){if(!confirm('사진을 삭제할까요?'))return;const r=await fetch('/api/shops/'+shop.id+'/photos',{method:'DELETE',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({url})});if(r.ok){shop.shop_images=(await r.json()).shop_images;render();}}load();</script></body></html>
