<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYCOM 업체 관리</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#17202a;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}.wrap{max-width:860px;margin:auto;padding:22px 16px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top h1{font-size:25px;margin:0}.card{background:#fff;border:1px solid #e9edf1;border-radius:22px;padding:20px;margin-bottom:15px;box-shadow:0 8px 28px rgba(0,0,0,.045)}.muted{color:#77808b;font-size:13px;line-height:1.55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:850;margin:12px 0 7px}input,textarea{width:100%;border:1px solid #dfe4e8;border-radius:12px;padding:12px;font:inherit;outline:none}textarea{min-height:110px;resize:vertical}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid #e1e6ea;border-radius:999px;padding:9px 12px;background:#fff;cursor:pointer;font-weight:750;font-size:13px}.chip.on{background:#e8fff6;border-color:#20c997;color:#087f5b}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:0;border-radius:13px;padding:13px 17px;font-weight:900;cursor:pointer}.primary{background:#12b886;color:#fff}.ghost{background:#f1f3f5;color:#303740}.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.photo{position:relative}.photo img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;display:block}.photo button{position:absolute;border:0;border-radius:9px;padding:6px 8px;background:rgba(255,255,255,.95);font-weight:900;cursor:pointer}.cover{left:6px;bottom:6px}.del{right:6px;top:6px}.photo.main img{outline:3px solid #20c997}.preview{border-radius:18px;overflow:hidden;background:#f1f3f5}.preview img{width:100%;height:220px;object-fit:cover}.preview .pbody{padding:15px}.badge{display:inline-block;background:#e6fcf5;color:#087f5b;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:900}.service-help{margin-top:8px}.notice{padding:12px;border-radius:13px;background:#fff8e1;color:#8a6200;font-size:12px}.hidden{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.photos{grid-template-columns:repeat(3,1fr)}.full{grid-column:auto}}</style></head><body><main class="wrap"><div class="top"><div><h1>🏪 업체 정보 관리</h1><div class="muted">고객이 업체를 선택할 때 가장 먼저 보는 정보입니다.</div></div><button class="btn ghost" onclick="location.href='/index.html'">MYCOM 홈</button></div><section class="card"><h3>기본 업체 정보</h3><div class="grid"><div><label>업체명 *</label><input id="shop_name"></div><div><label>전화번호</label><input id="phone" placeholder="010-0000-0000"></div><div class="full"><label>한줄 소개 *</label><input id="short_description" maxlength="120" placeholder="대구 게이밍 PC 전문점 · 조립/수리/중고PC"></div><div class="full"><label>상세 소개</label><textarea id="description" placeholder="우리 매장의 강점, 전문 분야, 고객에게 전하고 싶은 내용을 입력하세요."></textarea></div><div><label>주소 *</label><input id="address"></div><div><label>상세 주소</label><input id="detail_address"></div></div></section><section class="card"><h3>🕐 영업시간</h3><div class="grid"><div><label>영업시간</label><input id="business_hours" placeholder="평일 10:00~20:00 / 토 10:00~18:00"></div><div><label>휴무일</label><input id="closed_days" placeholder="매주 일요일, 공휴일"></div></div></section><section class="card"><h3>🛠️ 제공 서비스</h3><div class="chips" id="serviceChips"></div><input id="customServices" class="hidden"><div class="muted service-help">고객이 업체 카드를 보고 어떤 서비스를 받을 수 있는지 바로 알 수 있습니다.</div></section><section class="card"><h3>📷 대표사진 + 매장 사진</h3><div class="notice">대표사진은 업체 카드와 상세페이지 상단에 크게 표시됩니다. 간판·매장 내부·작업 모습·완성 PC 사진을 올려주세요.</div><div class="actions" style="margin-top:12px"><label class="btn primary" style="margin:0;display:inline-block"><input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple style="display:none">📷 사진 추가</label></div><div id="gallery" class="photos"></div></section><section class="card"><h3>👀 고객에게 이렇게 보여집니다</h3><div class="preview"><img id="previewImg" src="" class="hidden"><div class="pbody"><span class="badge">MYCOM 승인 업체</span><h2 id="previewName">업체명</h2><b>⭐ 0.0 · 후기 0</b><p id="previewShort" class="muted">한줄 소개가 표시됩니다.</p><div id="previewServices" class="chips"></div><p id="previewHours" class="muted"></p></div></div></section><section class="actions"><button class="btn primary" onclick="save()">💾 업체 정보 저장</button><button class="btn ghost" onclick="location.href='/shop.html?id='+shop.id">고객 화면 미리보기</button></section></main><script>const token=localStorage.getItem('mycom_token')||localStorage.getItem('token');let shop=null;const defaults=['조립PC','컴퓨터 견적','컴퓨터 수리','출장 서비스','중고PC','PC 업그레이드','부품 판매','윈도우 설치','데이터 복구','게이밍PC'];let selected=[];async function load(){if(!token)return location.href='/login.html';const r=await fetch('/api/shops/my',{headers:{Authorization:'Bearer '+token}});if(!r.ok){alert('업체 정보를 불러오지 못했습니다.');return}shop=(await r.json()).shop;for(const k of ['shop_name','short_description','description','address','detail_address','phone','business_hours','closed_days'])document.getElementById(k).value=shop[k]||'';selected=Array.isArray(shop.services)?shop.services:[];renderChips();render();}function renderChips(){document.getElementById('serviceChips').innerHTML=defaults.map(x=>`<button type="button" class="chip ${selected.includes(x)?'on':''}" onclick="toggleService('${x}')">${selected.includes(x)?'✓ ':''}${x}</button>`).join('')+`<button type="button" class="chip ${selected.some(x=>!defaults.includes(x))?'on':''}" onclick="customService()">＋ 기타</button>`}function toggleService(x){selected=selected.includes(x)?selected.filter(v=>v!==x):[...selected,x];renderChips();renderPreview()}function customService(){const x=prompt('추가할 서비스를 입력하세요.');if(x&&x.trim()){selected=[...new Set([...selected,x.trim()])];renderChips();renderPreview()}}async function save(){const body={};for(const k of ['shop_name','short_description','description','address','detail_address','phone','business_hours','closed_days'])body[k]=document.getElementById(k).value.trim();body.services=selected;const r=await fetch('/api/shops/'+shop.id,{method:'PUT',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(body)});if(!r.ok){alert((await r.json()).error||'저장 실패');return}shop=(await r.json()).shop;render();alert('업체 정보가 저장되었습니다.')}function render(){const imgs=shop.shop_images||[];document.getElementById('gallery').innerHTML=imgs.map(u=>`<div class="photo ${u===shop.cover_image?'main':''}"><img src="${u}"><button class="cover" onclick="setCover('${u}')">${u===shop.cover_image?'★ 대표':'대표로 설정'}</button><button class="del" onclick="delPhoto('${u}')">×</button></div>`).join('');const p=document.getElementById('previewImg');if(shop.cover_image){p.src=shop.cover_image;p.classList.remove('hidden')}else p.classList.add('hidden');renderPreview()}function renderPreview(){document.getElementById('previewName').textContent=document.getElementById('shop_name').value||'업체명';document.getElementById('previewShort').textContent=document.getElementById('short_description').value||'한줄 소개가 표시됩니다.';document.getElementById('previewHours').textContent=[document.getElementById('business_hours').value,document.getElementById('closed_days').value?'휴무: '+document.getElementById('closed_days').value:''].filter(Boolean).join(' · ');document.getElementById('previewServices').innerHTML=selected.map(x=>`<span class="chip on">${x}</span>`).join('')}document.querySelectorAll('input,textarea').forEach(e=>e.addEventListener('input',renderPreview));document.getElementById('photos').onchange=async e=>{for(const f of e.target.files){if(f.size>8*1024*1024){alert(f.name+'은 8MB를 초과합니다.');continue}const reader=new FileReader();reader.onload=async()=>{const r=await fetch('/api/shops/'+shop.id+'/photos',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({imageData:reader.result})});if(!r.ok)alert((await r.json()).error||'업로드 실패');else{const d=await r.json();shop.shop_images=d.shop_images;shop.cover_image=shop.cover_image||d.cover_image;render()}};reader.readAsDataURL(f)}e.target.value=''};async function setCover(url){const r=await fetch('/api/shops/'+shop.id+'/cover',{method:'PUT',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({url})});if(r.ok){shop.cover_image=(await r.json()).cover_image;render()}}async function delPhoto(url){if(!confirm('사진을 삭제할까요?'))return;const r=await fetch('/api/shops/'+shop.id+'/photos',{method:'DELETE',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({url})});if(r.ok){const d=await r.json();shop.shop_images=d.shop_images;shop.cover_image=d.cover_image;render()}}load();</script></body></html>
