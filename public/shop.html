<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYCOM 업체</title><style>body{margin:0;background:#f6f7f8;font-family:Arial,sans-serif;color:#191f28}.wrap{max-width:760px;margin:auto;background:#fff;min-height:100vh}.hero{height:260px;background:#eef1f3;display:flex;align-items:center;justify-content:center}.hero img{width:100%;height:100%;object-fit:cover}.body{padding:22px}.tag{display:inline-block;background:#e6fcf5;color:#087f5b;border-radius:20px;padding:7px 10px;font-size:12px;font-weight:800}.rating{color:#f08c00;font-weight:800}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}.btn{width:100%;border:0;border-radius:14px;padding:15px;margin-top:10px;font-weight:900}.primary{background:#12b886;color:#fff}.secondary{background:#f1f3f5}</style></head><body><main class="wrap"><div id="hero" class="hero">🏪</div><div class="body"><span class="tag">MYCOM 승인 업체</span><h1 id="name">업체</h1><div id="rating" class="rating">⭐ 0.0</div><p id="short"></p><p id="desc"></p><div id="services"></div><p id="address"></p><div id="photos" class="photos"></div><button class="btn primary" id="chat">💬 MYCOM에서 상담하기</button><button class="btn secondary" id="reserve">🏠 방문예약 상담</button></div></main><script>const id=new URLSearchParams(location.search).get('id');async function load(){if(!id)return;const r=await fetch('/api/shops/'+id);if(!r.ok)return;const d=await r.json(),s=d.shop;document.title=`${s.shop_name} | MYCOM`;document.getElementById('name').textContent=s.shop_name||'업체';document.getElementById('rating').textContent=`⭐ ${Number(s.avg_rating||s.rating||0).toFixed(1)} · 후기 ${s.review_count||0}`;document.getElementById('short').textContent=s.short_description||'';document.getElementById('desc').textContent=s.description||'';document.getElementById('address').textContent=`📍 ${s.address||''} ${s.detail_address||''}`;document.getElementById('services').innerHTML=(s.services||[]).map(x=>`<span style="display:inline-block;background:#f1f3f5;border-radius:9px;padding:7px;margin:3px;font-size:12px">${x}</span>`).join('');const imgs=s.shop_images||[];if(imgs[0])document.getElementById('hero').innerHTML=`<img src="${imgs[0]}">`;document.getElementById('photos').innerHTML=imgs.map(x=>`<img src="${x}">`).join('');document.getElementById('chat').onclick=()=>location.href=`/ai.html?type=general&shop=${s.id}`;document.getElementById('reserve').onclick=()=>location.href=`/ai.html?type=visit&shop=${s.id}`;}load();</script></body></html>
