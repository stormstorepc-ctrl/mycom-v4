<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYCOM 업체</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#17202a;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}.wrap{max-width:860px;margin:auto;background:#fff;min-height:100vh}.hero{height:330px;background:#e9edf0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}.hero img{width:100%;height:100%;object-fit:cover}.hero:after{content:"";position:absolute;inset:auto 0 0;height:90px;background:linear-gradient(transparent,rgba(0,0,0,.42))}.status{position:absolute;z-index:2;top:16px;left:16px;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.94);font-size:12px;font-weight:900}.body{padding:22px}.badge{display:inline-block;background:#e6fcf5;color:#087f5b;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900}.name{font-size:30px;letter-spacing:-1px;margin:12px 0 7px}.rating{color:#e67700;font-weight:900}.short{font-size:16px;font-weight:750;line-height:1.55}.desc{white-space:pre-line;color:#59636e;line-height:1.7}.services{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}.service{background:#f1f3f5;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:800}.info{background:#f7f8fa;border-radius:16px;padding:14px;line-height:1.8;color:#505a65;font-size:14px}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:13px;cursor:pointer}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;position:sticky;bottom:10px}.btn{border:0;border-radius:14px;padding:15px;font-weight:900;font-size:15px;cursor:pointer}.primary{background:#12b886;color:#fff}.secondary{background:#212529;color:#fff}.section{margin-top:25px}.review{border-top:1px solid #edf0f2;padding:14px 0}.review b{font-size:14px}.muted{color:#89929c;font-size:12px}.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.trust div{background:#f8f9fa;border-radius:14px;padding:12px;text-align:center;font-size:12px;font-weight:800}.trust b{display:block;font-size:16px;margin-bottom:4px}.response{margin-top:12px;padding:12px 14px;border-radius:14px;background:#e7f5ff;color:#1864ab;font-size:12px;font-weight:800}@media(max-width:600px){.hero{height:260px}.name{font-size:26px}.actions{grid-template-columns:1fr}.body{padding:18px}.trust{grid-template-columns:1fr 1fr 1fr}}
</style></head><body><main class="wrap"><div id="hero" class="hero">🏪</div><div class="body"><span id="status" class="badge">MYCOM 승인 업체</span><h1 id="name" class="name">업체</h1><div id="rating" class="rating">⭐ 0.0 · 후기 0</div><p id="short" class="short"></p><div class="trust"><div><b id="reviewScore">0.0</b>평점</div><div><b id="reviewCount">0</b>후기</div><div><b id="distance">-</b>거리</div></div><p id="desc" class="desc"></p><div id="services" class="services"></div><div id="info" class="info"></div><div id="response" class="response">💬 MYCOM 상담 연결을 이용해 빠르게 문의할 수 있습니다.</div><section class="section"><h3>📷 매장 사진</h3><div id="photos" class="photos"></div></section><section class="section"><h3>⭐ 고객 후기</h3><div id="reviews"></div></section><div class="actions"><button class="btn primary" id="chat">💬 MYCOM에서 상담하기</button><button class="btn secondary" id="reserve">🏠 방문예약 상담</button></div></div></main><script>const id=new URLSearchParams(location.search).get('id');async function load(){if(!id)return;const r=await fetch('/api/shops/'+id);if(!r.ok)return;const d=await r.json(),s=d.shop||{};document.title=`${s.shop_name||'업체'} | MYCOM`;const score=Number(s.avg_rating||s.rating||0).toFixed(1);document.getElementById('name').textContent=s.shop_name||'업체';document.getElementById('rating').textContent=`⭐ ${score} · 후기 ${s.review_count||0}`;document.getElementById('reviewScore').textContent=score;document.getElementById('reviewCount').textContent=s.review_count||0;document.getElementById('distance').textContent=s.distance!=null?Number(s.distance).toFixed(1)+'km':'-';document.getElementById('short').textContent=s.short_description||'';document.getElementById('desc').textContent=s.description||'';document.getElementById('services').innerHTML=(s.services||[]).map(x=>`<span class="service">${x}</span>`).join('');document.getElementById('info').innerHTML=`📍 ${s.address||''} ${s.detail_address||''}<br>📞 ${s.phone||'전화번호 미등록'}<br>🕐 ${s.business_hours||'영업시간 미등록'}${s.closed_days?`<br>🚫 휴무: ${s.closed_days}`:''}`;const imgs=s.shop_images||[],cover=s.cover_image||imgs[0];if(cover)document.getElementById('hero').innerHTML=`<img src="${cover}" alt="${s.shop_name||'업체'}">`;document.getElementById('photos').innerHTML=imgs.map(x=>`<img src="${x}" onclick="openImg('${x}')">`).join('');document.getElementById('reviews').innerHTML=(d.reviews||[]).map(x=>`<div class="review"><b>⭐ ${x.rating} · ${x.user_name||'고객'}</b><div>${x.content||''}</div><div class="muted">${x.created_at?new Date(x.created_at).toLocaleDateString('ko-KR'):''}</div></div>`).join('')||'<p class="muted">아직 등록된 후기가 없습니다.</p>';const day=['일','월','화','수','목','금','토'][new Date().getDay()];const closed=(s.closed_days||'').includes(day);document.getElementById('status').textContent=closed?'● 오늘 휴무':'● 지금 상담 가능';document.getElementById('status').style.background=closed?'#f1f3f5':'#e6fcf5';document.getElementById('status').style.color=closed?'#6c757d':'#087f5b';document.getElementById('chat').onclick=()=>location.href=`/ai.html?type=general&shop=${s.id}`;document.getElementById('reserve').onclick=()=>location.href=`/ai.html?type=visit&shop=${s.id}`}function openImg(u){const w=window.open('','_blank');if(w)w.document.write(`<img src="${u}" style="max-width:100%;height:auto">`)}load();</script></body></html>
