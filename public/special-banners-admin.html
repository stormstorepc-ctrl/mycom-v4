<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYCOM 특가 제품 배너 관리</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7f8;color:#191f28;font-family:Arial,'Noto Sans KR',sans-serif}.wrap{max-width:1000px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.card{background:#fff;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 5px 20px rgba(0,0,0,.05)}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:7px 0 14px}button{border:0;border-radius:10px;padding:10px 14px;background:#087657;color:#fff;font-weight:800;cursor:pointer}.back{background:#e8f2ee;color:#087657}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.banner{border:1px solid #eee;border-radius:14px;padding:12px}.banner img{width:100%;aspect-ratio:3.8/1;object-fit:cover;border-radius:10px;background:#f1f3f5}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.danger{background:#c0392b}.muted,.hint{font-size:12px;color:#6b7684}.hint{margin:-7px 0 12px}.status{display:none;margin:10px 0;padding:10px 12px;border-radius:10px;background:#eef8f3;color:#087657;font-weight:800}.status.error{background:#fff0f0;color:#c0392b}@media(max-width:700px){.wrap{padding:14px}.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><div><h1>🔥 특가 제품 배너 관리</h1><p>메인 상단 배너 바로 아래에 최대 4개의 특가 제품을 노출합니다.</p></div><button class="back" onclick="location.href='/admin.html'">← 관리자 페이지</button></div><section class="card"><h2>새 특가 배너 등록</h2><form id="form"><label>큰 제목</label><input id="title" maxlength="200" placeholder="예: 가성비 최고의 메인보드" required><label>하단 모델명</label><input id="subtitle" maxlength="300" placeholder="예: BIOSTAR B650MT-E PRO"><p class="hint">큰 제목은 크게, 모델명은 그 아래 작은 글씨로 표시됩니다.</p><label>구매 페이지 링크</label><input id="link" type="url" placeholder="https://구매페이지주소" required><div class="row"><div><label>노출 순서</label><input id="order" type="number" min="0" max="3" value="0"></div><div><label>배너 이미지</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp" required></div></div><button>특가 배너 등록</button></form></section><section class="card"><h2>등록된 특가 배너</h2><p>순서 0 → 1 → 2 → 3 순으로 메인에서 자동 슬라이드됩니다.</p><div id="status" class="status"></div><div id="list" class="grid"></div></section></main><script>const list=document.getElementById('list'),statusBox=document.getElementById('status'),getToken=()=>localStorage.getItem('mycom_token')||localStorage.getItem('token')||localStorage.getItem('access_token')||'';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function status(msg,error=false){statusBox.textContent=msg;statusBox.className='status'+(error?' error':'');statusBox.style.display=msg?'block':'none'}async function req(u,o={}){const h={...(o.headers||{})};const token=getToken();if(token)h.Authorization='Bearer '+token;const r=await fetch(u,{...o,headers:h,cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401||r.status===403)throw Error('관리자 인증이 만료되었거나 권한이 없습니다. 관리자 계정으로 다시 로그인해주세요.');throw Error(d.error||'요청 처리 중 오류가 발생했습니다.')}return d}function render(a){list.innerHTML=a.length?a.map(x=>`<article class="banner"><img src="${esc(x.image_url)}"><label>큰 제목</label><input id="t-${x.id}" value="${esc(x.title||'')}" maxlength="200"><label>하단 모델명</label><input id="s-${x.id}" value="${esc(x.subtitle||'')}" maxlength="300"><label>배너 이미지 교체</label><input id="f-${x.id}" type="file" accept="image/jpeg,image/png,image/webp"><label>구매 링크</label><input id="l-${x.id}" value="${esc(x.link_url||'')}"><div class="row"><input id="o-${x.id}" type="number" min="0" max="3" value="${Number(x.display_order)||0}"><button type="button" onclick="save('${x.id}',this)">정보 저장</button></div><p class="muted">고객 클릭 시 구매 페이지가 새 탭으로 열립니다.</p><button type="button" class="danger" onclick="removeBanner('${x.id}',this)">삭제</button></article>`).join(''):'<p>등록된 특가 배너가 없습니다.</p>'}async function load(){try{status('');const d=await req('/api/special-banners/admin');render(d.banners||[])}catch(e){status(e.message,true);if(/인증|권한/.test(e.message))setTimeout(()=>location.href='/admin.html',1200)}}function readFile(f){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)})}async function save(id,btn){try{status('저장 중...');btn.disabled=true;const f=document.getElementById('f-'+id).files[0];if(f){if(f.size>10*1024*1024)throw Error('이미지는 10MB 이하만 가능합니다.');await req('/api/special-banners/'+encodeURIComponent(id)+'/image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({imageData:await readFile(f)})})}const d=await req('/api/special-banners/'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:document.getElementById('t-'+id).value.trim(),subtitle:document.getElementById('s-'+id).value.trim(),linkUrl:document.getElementById('l-'+id).value.trim(),displayOrder:document.getElementById('o-'+id).value})});render([d.banner,...(await req('/api/special-banners/admin')).banners.filter(x=>x.id!==d.banner.id)]);status('특가 배너 정보가 저장되었습니다.')}catch(e){status(e.message,true)}finally{btn.disabled=false}}async function removeBanner(id,btn){if(!confirm('이 특가 배너를 완전히 삭제할까요? 삭제 후 복구할 수 없습니다.'))return;try{status('삭제 중...');btn.disabled=true;await req('/api/special-banners/'+encodeURIComponent(id),{method:'DELETE'});await load();status('특가 배너가 삭제되었습니다.')}catch(e){status(e.message,true)}finally{btn.disabled=false}}document.getElementById('form').onsubmit=async e=>{e.preventDefault();const f=document.getElementById('file').files[0];if(!f)return alert('배너 이미지를 선택해주세요.');if(f.size>10*1024*1024)return alert('이미지는 10MB 이하만 가능합니다.');try{status('등록 중...');await req('/api/special-banners',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:document.getElementById('title').value.trim(),subtitle:document.getElementById('subtitle').value.trim(),linkUrl:document.getElementById('link').value.trim(),displayOrder:document.getElementById('order').value,imageData:await readFile(f)})});e.target.reset();document.getElementById('order').value=0;await load();status('특가 배너가 등록되었습니다.')}catch(err){status(err.message,true)}};load();</script></body></html>
