<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYCOM 특가 제품 배너 관리</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7f8;color:#191f28;font-family:Arial,'Noto Sans KR',sans-serif}.wrap{max-width:1000px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.card{background:#fff;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 5px 20px rgba(0,0,0,.05)}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:7px 0 14px}button{border:0;border-radius:10px;padding:10px 14px;background:#087657;color:#fff;font-weight:800;cursor:pointer}.back{background:#e8f2ee;color:#087657}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.banner{border:1px solid #eee;border-radius:14px;padding:12px}.banner img{width:100%;aspect-ratio:3.8/1;object-fit:cover;border-radius:10px;background:#f1f3f5}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.danger{background:#c0392b}@media(max-width:700px){.wrap{padding:14px}.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><div><h1>🔥 특가 제품 배너 관리</h1><p>메인 상단 배너 바로 아래에 최대 4개의 특가 제품을 노출합니다.</p></div><button class="back" onclick="location.href='/admin.html'">← 관리자 페이지</button></div><section class="card"><h2>새 특가 배너 등록</h2><form id="form"><label>제품명 / 배너 제목</label><input id="title" maxlength="200" placeholder="예: RTX 5070 Ti 특가">
<label>구매 페이지 링크</label><input id="link" type="url" placeholder="https://구매페이지주소" required>
<div class="row"><div><label>노출 순서</label><input id="order" type="number" min="0" max="3" value="0"></div><div><label>배너 이미지</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp" required></div></div><button>특가 배너 등록</button></form></section><section class="card"><h2>등록된 특가 배너</h2><p>순서 0 → 1 → 2 → 3 순으로 메인에서 자동 슬라이드됩니다.</p><div id="list" class="grid"></div></section></main><script>const token=localStorage.getItem('mycom_token')||localStorage.getItem('token');const list=document.getElementById('list');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function req(u,o={}){const h={...(o.headers||{})};if(token)h.Authorization='Bearer '+token;const r=await fetch(u,{...o,headers:h}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'오류');return d}function render(a){list.innerHTML=a.length?a.map(x=>`<article class="banner"><img src="${esc(x.image_url)}"><h3>${esc(x.title)}</h3><label>구매 링크</label><input id="l-${x.id}" value="${esc(x.link_url||'')}"><div class="row"><input id="o-${x.id}" type="number" min="0" max="3" value="${Number(x.display_order)||0}"><button onclick="save('${x.id}')">저장</button></div><p><a href="${esc(x.link_url||'#')}" target="_blank" rel="noopener">구매 페이지 열기 ↗</a></p><button class="danger" onclick="removeBanner('${x.id}')">삭제</button></article>`).join(''):'<p>등록된 특가 배너가 없습니다.</p>'}async function load(){try{const d=await req('/api/special-banners/admin');render(d.banners||[])}catch(e){alert(e.message);location.href='/admin.html'}}async function save(id){try{await req('/api/special-banners/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({linkUrl:document.getElementById('l-'+id).value,displayOrder:document.getElementById('o-'+id).value})});load()}catch(e){alert(e.message)}}async function removeBanner(id){if(!confirm('이 특가 배너를 삭제할까요?'))return;try{await req('/api/special-banners/'+id,{method:'DELETE'});load()}catch(e){alert(e.message)}}document.getElementById('form').onsubmit=async e=>{e.preventDefault();const f=document.getElementById('file').files[0];if(!f)return alert('배너 이미지를 선택해주세요.');if(f.size>10*1024*1024)return alert('이미지는 10MB 이하만 가능합니다.');const reader=new FileReader();reader.onload=async()=>{try{await req('/api/special-banners',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:document.getElementById('title').value,linkUrl:document.getElementById('link').value,displayOrder:document.getElementById('order').value,imageData:reader.result})});e.target.reset();document.getElementById('order').value=0;load();alert('특가 배너가 등록되었습니다.')}catch(err){alert(err.message)}};reader.readAsDataURL(f)};load();</script></body></html>
