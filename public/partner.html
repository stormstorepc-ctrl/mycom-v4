<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYCOM PARTNER</title><style>:root{--p:#12b886;--bg:#f5f7f8;--text:#191f28;--sub:#6b7684;--line:#e9ecef}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Pretendard','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-size:25px;font-weight:900}.brand b{color:var(--p)}button{border:0;border-radius:12px;padding:11px 15px;font:inherit;font-weight:700;cursor:pointer}.logout,.ghost{background:#fff;border:1px solid var(--line)}.nav{display:flex;gap:8px;overflow:auto;margin-bottom:20px}.nav button{white-space:nowrap;background:#fff}.nav button.active{background:var(--p);color:#fff}.hero{background:linear-gradient(135deg,#0ca678,#38d9a9);color:#fff;padding:28px;border-radius:24px;margin-bottom:20px}.hero h1{margin:5px 0;font-size:28px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px}.card{background:#fff;border-radius:18px;padding:18px;border:1px solid var(--line)}.card span{color:var(--sub);font-size:13px}.card strong{display:block;font-size:25px;margin-top:10px}.section{display:none}.section.active{display:block}.panel{background:#fff;border-radius:20px;padding:20px;border:1px solid var(--line);margin-bottom:16px}.row{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.title{font-size:19px;font-weight:900;margin:0 0 14px}.badge{background:#e6fcf5;color:#087f5b;padding:5px 8px;border-radius:8px;font-size:12px;font-weight:800}.primary{background:var(--p);color:#fff}.danger{background:#fff0f0;color:#e03131}.muted{color:var(--sub);font-size:13px}.empty{padding:35px;text-align:center;color:var(--sub)}input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;margin:5px 0 12px}textarea{min-height:100px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modal-box{background:#fff;width:min(460px,100%);border-radius:22px;padding:22px}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:800px){.wrap{padding:16px}.grid{grid-template-columns:repeat(2,1fr)}.grid .card:last-child{grid-column:span 2}.top{align-items:flex-start}.row{align-items:flex-start;flex-direction:column}.actions{width:100%}}</style></head><body><div class="wrap"><header class="top"><div><div class="brand">MYCOM <b>PARTNER</b></div><div class="muted">컴퓨터 업체 운영센터</div></div><div><button class="ghost" onclick="location.href='/'">고객 화면</button> <button class="logout" onclick="logout()">로그아웃</button></div></header><nav class="nav"><button class="active" onclick="tab('dashboard',this)">대시보드</button><button onclick="tab('quotes',this)">견적 요청</button><button onclick="tab('bids',this)">내 입찰</button><button onclick="tab('reservations',this)">예약 관리</button><button onclick="tab('messages',this)">상담 관리</button><button onclick="tab('shop',this)">내 매장</button></nav><section id="dashboard" class="section active"><div class="hero"><div class="muted" style="color:#d3f9d8">MYCOM 인증 파트너</div><h1 id="shopName">업체 관리자</h1><div>새로운 고객 요청과 예약, 상담을 한 곳에서 관리하세요.</div></div><div class="grid"><div class="card"><span>새 견적</span><strong id="openQuotes">0</strong></div><div class="card"><span>진행 입찰</span><strong id="activeBids">0</strong></div><div class="card"><span>오늘 예약</span><strong id="todayReservations">0</strong></div><div class="card"><span>미확인 상담</span><strong id="unreadMessages">0</strong></div><div class="card"><span>이번 달 거래</span><strong id="monthSales">₩0</strong></div></div><div class="panel"><h2 class="title">🔥 새로운 견적 요청</h2><div id="recentQuotes"></div></div></section><section id="quotes" class="section"><div class="panel"><h2 class="title">고객 견적 요청</h2><div id="quoteList"></div></div></section><section id="bids" class="section"><div class="panel"><h2 class="title">내 입찰 관리</h2><div id="bidList"></div></div></section><section id="reservations" class="section"><div class="panel"><h2 class="title">예약 관리</h2><div id="reservationList"></div></div></section><section id="messages" class="section"><div class="panel"><h2 class="title">고객 상담</h2><div id="messageList"></div></div></section><section id="shop" class="section"><div class="panel"><h2 class="title">내 매장 정보</h2><form onsubmit="saveShop(event)"><label>매장명</label><input id="s_name"><label>주소</label><input id="s_address"><label>상세 주소</label><input id="s_detail"><label>전화번호</label><input id="s_phone"><label>위도</label><input id="s_lat"><label>경도</label><input id="s_lng"><label>매장 소개</label><textarea id="s_desc"></textarea><button class="primary">매장 정보 저장</button></form></div></section></div><div class="modal" id="bidModal"><div class="modal-box"><h2 id="bidTitle">입찰하기</h2><div class="muted" id="bidSpec"></div><label>입찰 금액</label><input id="bidAmount" type="number" placeholder="예: 1500000"><label>고객에게 전달할 메시지</label><textarea id="bidMessage" placeholder="견적 내용과 안내 사항을 입력하세요"></textarea><div class="actions"><button class="primary" onclick="submitBid()">입찰 등록</button><button class="ghost" onclick="closeBid()">취소</button></div></div></div><script>const token=localStorage.getItem('mycom_token');let selectedQuote=null;if(!token){alert('업체 계정으로 로그인 후 이용하세요.');location.href='/'}const headers={'Content-Type':'application/json','Authorization':'Bearer '+token};const won=v=>new Intl.NumberFormat('ko-KR',{style:'currency',currency:'KRW',maximumFractionDigits:0}).format(Number(v||0));async function api(url,opt={}){const r=await fetch('/api/partner'+url,{...opt,headers:{...headers,...(opt.headers||{})}});const d=await r.json();if(!r.ok)throw new Error(d.error||'요청 실패');return d}function tab(id,btn){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');if(id==='quotes')loadQuotes();if(id==='bids')loadBids();if(id==='reservations')loadReservations();if(id==='messages')loadMessages();if(id==='shop')loadShop()}function empty(el,msg){el.innerHTML='<div class="empty">'+msg+'</div>'}function quoteRow(q,button=true){const spec=[q.cpu,q.gpu,q.ram,q.storage].filter(Boolean).join(' · ');return `<div class="row"><div><span class="badge">${q.quote_type==='sell'?'PC 판매':'PC 구매'}</span><h3>${q.title}</h3><div class="muted">${spec||q.description||'상세 정보 없음'}</div><div class="muted">예산 ${won(q.budget_min)} ~ ${won(q.budget_max)}</div></div>${button?`<div class="actions"><button class="primary" onclick='openBid(${JSON.stringify(q).replace(/'/g,"&#39;")})'>${q.my_bid?'입찰 확인':'입찰하기'}</button></div>`:''}</div>`}async function loadDashboard(){try{const d=await api('/dashboard');shopName.textContent=d.shop.shop_name;openQuotes.textContent=d.stats.open_quotes;activeBids.textContent=d.stats.active_bids;todayReservations.textContent=d.stats.today_reservations;unreadMessages.textContent=d.stats.unread_messages;monthSales.textContent=won(d.stats.month_sales);recentQuotes.innerHTML=d.recent_quotes.length?d.recent_quotes.map(q=>quoteRow(q)).join(''):'';if(!d.recent_quotes.length)empty(recentQuotes,'새로운 견적 요청이 없습니다.')}catch(e){alert(e.message)}}async function loadQuotes(){const d=await api('/quotes');quoteList.innerHTML=d.quotes.length?d.quotes.map(q=>quoteRow(q)).join(''):'';if(!d.quotes.length)empty(quoteList,'현재 참여 가능한 견적이 없습니다.')}function openBid(q){selectedQuote=q;bidTitle.textContent=q.title+' 입찰';bidSpec.textContent=[q.cpu,q.gpu,q.ram,q.storage].filter(Boolean).join(' · ');bidModal.classList.add('show')}function closeBid(){bidModal.classList.remove('show');selectedQuote=null}async function submitBid(){if(!selectedQuote)return;const amount=Number(bidAmount.value);if(!amount)return alert('입찰 금액을 입력하세요.');const r=await fetch('/api/bids',{method:'POST',headers,body:JSON.stringify({quote_id:selectedQuote.id,amount,message:bidMessage.value})});const d=await r.json();if(!r.ok)return alert(d.error||'입찰 실패');closeBid();bidAmount.value='';bidMessage.value='';alert('입찰이 등록되었습니다.');loadQuotes();loadDashboard()}async function loadBids(){const d=await api('/bids');bidList.innerHTML=d.bids.length?d.bids.map(b=>`<div class="row"><div><span class="badge">${b.is_selected?'선택됨':'입찰 중'}</span><h3>${b.title}</h3><div class="muted">입찰가 ${won(b.amount)} · ${b.status}</div><div class="muted">${b.message||''}</div></div></div>`).join(''):'';if(!d.bids.length)empty(bidList,'등록한 입찰이 없습니다.')}async function loadReservations(){const d=await api('/reservations');reservationList.innerHTML=d.reservations.length?d.reservations.map(r=>`<div class="row"><div><span class="badge">${r.status}</span><h3>${r.customer_name} · ${r.service_type}</h3><div class="muted">${r.reservation_date} ${String(r.reservation_time).slice(0,5)} · ${r.phone||''}</div></div><div class="actions">${r.status==='pending'?`<button class="primary" onclick="reservation('${r.id}','confirmed')">승인</button>`:''}${r.status==='confirmed'?`<button class="primary" onclick="reservation('${r.id}','completed')">완료</button>`:''}<button class="danger" onclick="reservation('${r.id}','cancelled')">취소</button></div></div>`).join(''):'';if(!d.reservations.length)empty(reservationList,'예약 내역이 없습니다.')}async function reservation(id,status){try{await api('/reservations/'+id,{method:'PATCH',body:JSON.stringify({status})});loadReservations();loadDashboard()}catch(e){alert(e.message)}}async function loadMessages(){const d=await api('/messages');messageList.innerHTML=d.rooms.length?d.rooms.map(r=>`<div class="row"><div><h3>${r.customer_name} ${r.unread?`<span class="badge">새 메시지 ${r.unread}</span>`:''}</h3><div class="muted">${r.last_message||'아직 대화가 없습니다.'}</div></div><button class="primary" onclick="location.href='/'">상담 열기</button></div>`).join(''):'';if(!d.rooms.length)empty(messageList,'진행 중인 상담이 없습니다.')}async function loadShop(){const d=await api('/shop');const s=d.shop;s_name.value=s.shop_name||'';s_address.value=s.address||'';s_detail.value=s.detail_address||'';s_phone.value=s.phone||'';s_lat.value=s.latitude||'';s_lng.value=s.longitude||'';s_desc.value=s.description||''}async function saveShop(e){e.preventDefault();try{await api('/shop',{method:'PUT',body:JSON.stringify({shop_name:s_name.value,address:s_address.value,detail_address:s_detail.value,phone:s_phone.value,latitude:s_lat.value?Number(s_lat.value):null,longitude:s_lng.value?Number(s_lng.value):null,description:s_desc.value})});alert('저장되었습니다.');loadDashboard()}catch(e){alert(e.message)}}function logout(){localStorage.removeItem('mycom_token');localStorage.removeItem('mycom_user');location.href='/'}loadDashboard();</script></body></html>
