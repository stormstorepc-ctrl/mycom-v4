<!doctype html><html lang="ko"><head><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css"><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css"><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYCOM PARTNER</title><style>body{margin:0;font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;background:#F4F6F8;color:#16181C}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:24px;color:#1F6FE5}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 4px 20px #16181C0a}.num{font-size:30px;font-weight:800;margin-top:8px}.cols{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}.row{padding:15px 0;border-bottom:1px solid #E6E9EE}.row:last-child{border:0}button{border:0;border-radius:10px;padding:10px 14px;background:#1F6FE5;color:#fff;font-weight:700;cursor:pointer}.ghost{background:#EAF2FE;color:#1558BD}.muted{color:#6B7684;font-size:13px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.quick button{background:#EAF2FE;color:#1558BD;text-align:left;padding:14px}.error{background:#F5F1E8;color:#B26A00;border-radius:12px;padding:12px;margin-top:14px;display:none}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.quick{grid-template-columns:1fr}.wrap{padding:16px}}</style></head><body><main class="wrap"><header class="top"><div><div class="brand">MYCOM PARTNER</div><div class="muted" id="shopName">업체 관리자</div></div><div><button class="ghost" onclick="location.href='/'">일반 MYCOM</button> <button onclick="logout()">로그아웃</button></div></header><section id="errorBox" class="error"></section><section class="grid"><div class="card">새 견적<div class="num" id="newQuotes">-</div></div><div class="card">진행 입찰<div class="num" id="activeBids">-</div></div><div class="card">오늘 예약<div class="num" id="todayReservations">-</div></div><div class="card">상담방<div class="num" id="chatRooms">-</div></div></section><section class="card"><h2><i class="ph-fill ph-lightning"></i> 빠른 관리</h2><div class="quick"><button onclick="location.href='/partner-reservations.html'"><i class="ph ph-calendar-blank"></i> 예약 관리<br><small>예약 확정·완료·취소</small></button><button onclick="location.href='/partner-chat.html'"><i class="ph ph-chat-circle"></i> 고객 상담<br><small>상담방 및 메시지</small></button><button onclick="editShop()"><i class="ph ph-storefront"></i> 매장 관리<br><small>정보·사진·대표사진</small></button></div></section><section class="cols"><div class="card"><h2><i class="ph-fill ph-fire"></i> 새로운 견적 요청</h2><div id="quotes">불러오는 중...</div></div><div class="card"><h2><i class="ph ph-currency-krw"></i> 최근 입찰</h2><div id="bids">불러오는 중...</div></div></section><section class="card" style="margin-top:18px"><h2><i class="ph ph-storefront"></i> 내 매장 정보</h2><div id="shopInfo" class="muted">불러오는 중...</div></section></main><script src="/shop-status.js"></script><script src="partner.js"></script></body></html>
