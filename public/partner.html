<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYCOM PARTNER</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f6f7f9;color:#202124}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:24px;color:#00a878}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 4px 20px #0000000a}.num{font-size:30px;font-weight:800;margin-top:8px}.cols{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}.row{padding:15px 0;border-bottom:1px solid #eee}.row:last-child{border:0}button{border:0;border-radius:10px;padding:10px 14px;background:#00a878;color:#fff;font-weight:700;cursor:pointer}.ghost{background:#eef7f4;color:#087657}.muted{color:#777;font-size:13px}.hidden{display:none}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.wrap{padding:16px}}</style></head><body><main class="wrap"><header class="top"><div><div class="brand">MYCOM PARTNER</div><div class="muted" id="shopName">업체 관리자</div></div><div><button class="ghost" onclick="location.href='/'">일반 MYCOM</button> <button onclick="logout()">로그아웃</button></div></header><section class="grid"><div class="card">새 견적<div class="num" id="newQuotes">-</div></div><div class="card">진행 입찰<div class="num" id="activeBids">-</div></div><div class="card">오늘 예약<div class="num" id="todayReservations">-</div></div><div class="card">상담방<div class="num" id="chatRooms">-</div></div></section><section class="cols"><div class="card"><h2>🔥 새로운 견적 요청</h2><div id="quotes">불러오는 중...</div></div><div class="card"><h2>💰 최근 입찰</h2><div id="bids">불러오는 중...</div></div></section><section class="card" style="margin-top:18px"><h2>🏪 내 매장 관리</h2><div id="shopInfo" class="muted">불러오는 중...</div><p><button onclick="editShop()">매장 정보
