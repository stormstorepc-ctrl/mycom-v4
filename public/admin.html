<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYCOM 최고 관리자</title><style>body{margin:0;background:#f5f7f8;font-family:Arial,sans-serif;color:#1f2937}.wrap{max-width:1200px;margin:auto;padding:24px}.card{background:#fff;border-radius:18px;padding:20px;margin:16px 0}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #eee;text-align:left}button{border:0;border-radius:9px;padding:9px 12px;background:#087657;color:#fff;cursor:pointer}.danger{background:#c0392b}.ghost{background:#e8f2ee;color:#087657}.small{padding:6px 9px;font-size:12px}.tabs{display:flex;gap:8px;margin:16px 0}.tab.on{background:#087657;color:#fff}.tab{background:#e8f2ee;color:#087657}section.panel{display:none}section.panel.on{display:block}.search{width:100%;padding:12px;box-sizing:border-box;border:1px solid #ddd;border-radius:10px;margin:8px 0 14px}.badge{padding:4px 8px;border-radius:99px;background:#eef5f1;color:#087657;font-size:12px}</style><body><main class="wrap" id="app"></main><script>let token=localStorage.getItem('mycom_token')||localStorage.getItem('token'),USERS=[],SHOPS=[];const app=document.getElementById('app');async function req(u,o={}){let h={...(o.headers||{})};if(token)h.Authorization='Bearer '+token;let r=await fetch(u,{...o,headers:h});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'오류');return d}const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function login(m=''){app.innerHTML=`<section class="card"><h1>👑 MYCOM 최고 관리자</h1><form id="f"><input id="e" type="email" placeholder="관리자 이메일" required><input id="p" type="password" placeholder="관리자 비밀번호" required><button>로그인</button></form><p>${esc(m)}</p></section>`;f.onsubmit=async x=>{x.preventDefault();try{let d=await req('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e.value,password:p.value})});if(d.user.role!=='admin')throw Error('최고 관리자 권한이 필요합니다.');token=d.token;localStorage.setItem('mycom_token',token);boot()}catch(z){alert(z.message)}}}function shopRows(a){return a.map(x=>`<tr><td><b>${esc(x.shop_name)}</b><br><small>${esc(x.email)}</small></td><td>${esc(x.name)}</td><td>${x.is_approved?'승인':'대기'} / ${x.is_active===false?'정지':'운영'}</td><td><button class="small" onclick="approval('${x.id}',${!x.is_approved})">${x.is_approved?'승인취소':'승인'}</button> <button class="small ${x.is_active===false?'ghost':'danger'}" onclick="active('${x.id}',${x.is_active===false})">${x.is_active===false?'복구':'정지'}</button> <button class="small danger" onclick="removeMember('${x.user_id}','${esc(x.shop_name)}')">삭제</button></td></tr>`).join('')}function userRows(a){return a.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td><span class="badge">${esc(x.role)}</span></td><td>${new Date(x.created_at).toLocaleDateString('ko-KR')}</td><td>${x.role==='admin'?'최고 관리자':`<button class="small ghost" onclick="changeRole('${x.id}','${x.role==='shop'?'user':'shop'}')">권한변경</button> <button class="small danger" onclick="removeMember('${x.id}','${esc(x.name)}')">삭제</button>`}</td></tr>`).join('')}function showTab(n){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.getElementById('panel-'+n).classList.add('on');document.getElementById('tab-'+n).classList.add('on')}function render(){shopBody.innerHTML=shopRows(SHOPS);userBody.innerHTML=userRows(USERS)}async function boot(){if(!token)return login();try{let me=await req('/api/auth/me');if(me.user.role!=='admin')return login('최고 관리자 권한이 필요합니다.');let [u,sh]=await Promise.all([req('/api/admin/users'),req('/api/admin/shops')]);USERS=u.users;SHOPS=sh.shops;app.innerHTML=`<h1>👑 MYCOM 최고 관리자</h1><nav class="tabs"><button class="tab on" id="tab-shops" onclick="showTab('shops')">🏪 업체 관리</button><button class="tab" id="tab-users" onclick="showTab('users')">👥 개인 회원 관리</button></nav><section class="card panel on" id="panel-shops"><h2>업체 관리</h2><input class="search" oninput="shopBody.innerHTML=shopRows(SHOPS.filter(x=>JSON.stringify(x).toLowerCase().includes(this.value.toLowerCase())))" placeholder="업체 검색"><table><thead><tr><th>업체</th><th>담당자</th><th>상태</th><th>관리</th></tr></thead><tbody id="shopBody"></tbody></table></section><section class="card panel" id="panel-users"><h2>개인 회원 관리</h2><input class="search" oninput="userBody.innerHTML=userRows(USERS.filter(x=>JSON.stringify(x).toLowerCase().includes(this.value.toLowerCase())))" placeholder="회원 검색"><table><thead><tr><th>이름</th><th>이메일</th><th>권한</th><th>가입일</th><th>관리</th></tr></thead><tbody id="userBody"></tbody></table></section>`;render()}catch(e){login(e.message)}}async function approval(id,v){try{await req('/api/admin/shops/'+id+'/approval',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({approved:v})});boot()}catch(e){alert(e.message)}}async function active(id,v){try{await req('/api/admin/shops/'+id+'/active',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({active:v})});boot()}catch(e){alert(e.message)}}async function changeRole(id,role){if(!confirm('권한을 변경할까요?'))return;try{await req('/api/admin/users/'+id+'/role',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({role})});boot()}catch(e){alert(e.message)}}async function removeMember(id,name){if(!confirm('정말 '+name+' 회원을 삭제할까요?\n삭제 후에는 복구할 수 없습니다.'))return;if(!confirm('마지막 확인: '+name+' 회원을 영구 삭제합니다.'))return;try{await req('/api/admin/users/'+id,{method:'DELETE'});alert('삭제되었습니다.');boot()}catch(e){alert(e.message)}}boot();</script></main></body></html>
