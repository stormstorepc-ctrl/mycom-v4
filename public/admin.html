<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYCOM 최고 관리자</title><style>body{margin:0;background:#f5f7f8;font-family:Arial,sans-serif;color:#1f2937}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center}.card{background:#fff;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 4px 20px #0000000d}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.num{font-size:28px;font-weight:bold;color:#087657}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tab{background:#e8f2ee;color:#087657}.tab.on{background:#087657;color:#fff}section.panel{display:none}section.panel.on{display:block}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #eee;text-align:left}button{border:0;border-radius:9px;padding:9px 12px;background:#087657;color:#fff;cursor:pointer}.danger{background:#c0392b}.ghost{background:#e8f2ee;color:#087657}.small{padding:6px 9px;font-size:12px}.search{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:10px;margin:8px 0 14px}.empty{padding:32px;text-align:center;color:#6b7280;background:#f8faf9;border-radius:12px}.login{max-width:420px;margin:100px auto}.login input{width:100%;box-sizing:border-box;padding:13px;margin:6px 0;border:1px solid #ddd;border-radius:9px}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef5f1;color:#087657;font-size:12px}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}table{font-size:12px}.wrap{padding:12px}.top{align-items:flex-start}}</style><body><main class="wrap" id="app"></main><script>let token=localStorage.getItem('mycom_token')||localStorage.getItem('token');let USERS=[],SHOPS=[];const app=document.getElementById('app');async function req(u,o={}){let h={...(o.headers||{})};if(token)h.Authorization='Bearer '+token;let r=await fetch(u,{...o,headers:h});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'오류');return d}const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function login(msg=''){app.innerHTML=`<section class="card login"><h1>👑 MYCOM 최고 관리자</h1><p>전체 서비스 운영자 전용</p><form id="f"><input id="e" type="email" placeholder="관리자 이메일" required><input id="p" type="password" placeholder="관리자 비밀번호" required><button style="width:100%">관리자 로그인</button></form><p id="m">${esc(msg)}</p><button class="ghost" onclick="location.href='/'">MYCOM 메인</button></section>`;f.onsubmit=async x=>{x.preventDefault();try{let d=await req('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e.value,password:p.value})});if(d.user.role!=='admin')throw Error('이 계정은 최고 관리자 계정이 아닙니다.');token=d.token;localStorage.setItem('mycom_token',token);boot()}catch(err){m.textContent=err.message}}}function shopRows(list){return list.length?list.map(x=>`<tr><td><b>${esc(x.shop_name)}</b><br><small>${esc(x.email)}</small></td><td>${esc(x.name)}</td><td>${x.is_approved?'<span class="badge">승인 완료</span>':'<span class="badge">승인 대기</span>'}<br>${x.is_active===false?'정지':'운영'}</td><td><button class="small" onclick="approval('${x.id}',${!x.is_approved})">${x.is_approved?'승인 취소':'승인'}</button> <button class="small ${x.is_active===false?'ghost':'danger'}" onclick="active('${x.id}',${x.is_active===false})">${x.is_active===false?'복구':'정지'}</button></td></tr>`).join(''):`<tr><td colspan="4"><div class="empty">등록된 컴퓨터 업체가 없습니다.<br><small>먼저 MYCOM에서 「컴퓨터 업체」로 회원가입하면 여기에 나타납니다.</small></div></td></tr>`}function userRows(list){return list.length?list.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td><span class="badge">${esc(x.role)}</span></td><td>${new Date(x.created_at).toLocaleDateString('ko-KR')}</td><td>${x.role!=='admin'?`<button class="small ghost" onclick="changeRole('${x.id}','${x.role==='shop'?'user':'shop'}')">${x.role==='shop'?'일반회원으로':'업체 권한으로'}</button>`:'최고 관리자'}</td></tr>`).join(''):`<tr><td colspan="5"><div class="empty">검색 결과가 없습니다.</div></td></tr>`}function renderLists(){document.getElementById('shopBody').innerHTML=shopRows(SHOPS);document.getElementById('userBody').innerHTML=userRows(USERS)}function showTab(n){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.getElementById('panel-'+n).classList.add('on');document.getElementById('tab-'+n).classList.add('on')}function filterUsers(v){let q=v.toLowerCase();document.getElementById('userBody').innerHTML=userRows(USERS.filter(x=>[x.name,x.email,x.role].join(' ').toLowerCase().includes(q)))}function filterShops(v){let q=v.toLowerCase();document.getElementById('shopBody').innerHTML=shopRows(SHOPS.filter(x=>[x.shop_name,x.email,x.name].join(' ').toLowerCase().includes(q)))}async function boot(){if(!token)return login();try{let me=await req('/api/auth/me');if(me.user.role!=='admin')return login('최고 관리자 권한이 필요합니다.');let [s,u,sh]=await Promise.all([req('/api/admin/stats'),req('/api/admin/users'),req('/api/admin/shops')]);USERS=u.users;SHOPS=sh.shops;app.innerHTML=`<header class="top"><div><h1>👑 MYCOM 최고 관리자</h1><p>전체 회원 · 컴퓨터 업체 · 서비스 관리</p></div><button class="ghost" onclick="logout()">로그아웃</button></header><section class="stats"><div class="card">전체 회원<div class="num">${s.total_users}</div></div><div class="card">컴퓨터 업체<div class="num">${s.total_shops}</div></div><div class="card">승인 대기<div class="num">${s.pending_shops}</div></div><div class="card">진행 견적<div class="num">${s.active_quotes}</div></div></section><nav class="tabs"><button class="tab on" id="tab-shops" onclick="showTab('shops')">🏪 업체 관리</button><button class="tab" id="tab-pending" onclick="showTab('pending')">✅ 승인 대기 (${s.pending_shops})</button><button class="tab" id="tab-users" onclick="showTab('users')">👥 회원 관리</button></nav><section class="card panel on" id="panel-shops"><h2>🏪 컴퓨터 업체 관리</h2><input class="search" placeholder="업체명, 담당자, 이메일 검색" oninput="filterShops(this.value)"><table><thead><tr><th>업체</th><th>담당자</th><th>상태</th><th>관리</th></tr></thead><tbody id="shopBody"></tbody></table></section><section class="card panel" id="panel-pending"><h2>✅ 승인 대기 업체</h2><div id="pendingBox"></div></section><section class="card panel" id="panel-users"><h2>👥 회원 관리</h2><input class="search" placeholder="이름, 이메일, 권한 검색" oninput="filterUsers(this.value)"><table><thead><tr><th>이름</th><th>이메일</th><th>권한</th><th>가입일</th><th>관리</th></tr></thead><tbody id="userBody"></tbody></table></section>`;renderLists();let p=SHOPS.filter(x=>!x.is_approved);document.getElementById('pendingBox').innerHTML=p.length?`<table><thead><tr><th>업체</th><th>담당자</th><th>관리</th></tr></thead><tbody>${p.map(x=>`<tr><td><b>${esc(x.shop_name)}</b><br>${esc(x.email)}</td><td>${esc(x.name)}</td><td><button onclick="approval('${x.id}',true)">승인하기</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty">🎉 현재 승인 대기 중인 업체가 없습니다.</div>`}catch(err){login('로그인 정보를 확인할 수 없습니다. '+err.message)}}async function approval(id,v){if(!confirm(v?'이 업체를 승인할까요?':'업체 승인을 취소할까요?'))return;try{await req('/api/admin/shops/'+id+'/approval',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({approved:v})});alert(v?'업체를 승인했습니다.':'업체 승인을 취소했습니다.');boot()}catch(e){alert(e.message)}}async function active(id,v){if(!confirm(v?'업체 운영을 복구할까요?':'이 업체를 정지할까요?'))return;try{await req('/api/admin/shops/'+id+'/active',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({active:v})});alert(v?'업체를 복구했습니다.':'업체를 정지했습니다.');boot()}catch(e){alert(e.message)}}async function changeRole(id,role){if(!confirm('회원 권한을 '+role+'(으)로 변경할까요?'))return;try{await req('/api/admin/users/'+id+'/role',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({role})});alert('권한을 변경했습니다.');boot()}catch(e){alert(e.message)}}function logout(){localStorage.removeItem('mycom_token');localStorage.removeItem('token');token=null;login()}boot();</script></main></body></html>
