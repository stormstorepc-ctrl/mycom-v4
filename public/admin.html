<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYCOM 최고 관리자</title><style>body{margin:0;background:#f5f7f8;font-family:Arial,sans-serif;color:#1f2937}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center}.card{background:#fff;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 4px 20px #0000000d}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.num{font-size:28px;font-weight:bold;color:#087657}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #eee;text-align:left}button{border:0;border-radius:9px;padding:9px 12px;background:#087657;color:#fff;cursor:pointer}.danger{background:#c0392b}.ghost{background:#e8f2ee;color:#087657}.login{max-width:420px;margin:100px auto}.login input{width:100%;box-sizing:border-box;padding:13px;margin:6px 0;border:1px solid #ddd;border-radius:9px}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}table{font-size:12px}}</style><body><main class="wrap" id="app"></main><script>let token=localStorage.getItem('mycom_token')||localStorage.getItem('token');const app=document.getElementById('app');async function req(u,o={}){let h={...(o.headers||{})};if(token)h.Authorization='Bearer '+token;let r=await fetch(u,{...o,headers:h});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'오류');return d}function login(msg=''){app.innerHTML=`<section class="card login"><h1>👑 MYCOM 최고 관리자</h1><p>전체 서비스 운영자 전용</p><form id="f"><input id="e" type="email" placeholder="관리자 이메일" required><input id="p" type="password" placeholder="관리자 비밀번호" required><button style="width:100%">관리자 로그인</button></form><p id="m">${msg}</p><button class="ghost" onclick="location.href='/'">MYCOM 메인</button></section>`;f.onsubmit=async x=>{x.preventDefault();try{let d=await req('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e.value,password:p.value})});if(d.user.role!=='admin')throw Error('이 계정은 최고 관리자 계정이 아닙니다.');token=d.token;localStorage.setItem('mycom_token',token);boot()}catch(err){m.textContent=err.message}}}async function boot(){if(!token)return login();try{let me=await req('/api/auth/me');if(me.user.role!=='admin')return login('최고 관리자 권한이 필요합니다.');let [s,u,sh]=await Promise.all([req('/api/admin/stats'),req('/api/admin/users'),req('/api/admin/shops')]);app.innerHTML=`<header class="top"><div><h1>👑 MYCOM 최고 관리자</h1><p>전체 회원 · 컴퓨터 업체 · 서비스 관리</p></div><button class="ghost" onclick="logout()">로그아웃</button></header><section class="stats"><div class="card">전체 회원<div class="num">${s.total_users}</div></div><div class="card">컴퓨터 업체<div class="num">${s.total_shops}</div></div><div class="card">승인 대기<div class="num">${s.pending_shops}</div></div><div class="card">진행 견적<div class="num">${s.active_quotes}</div></div></section><section class="card"><h2>🏪 컴퓨터 업체 승인 관리</h2><table><thead><tr><th>업체</th><th>담당자</th><th>상태</th><th>관리</th></tr></thead><tbody>${sh.shops.map(x=>`<tr><td><b>${x.shop_name}</b><br>${x.email}</td><td>${x.name}</td><td>${x.is_approved?'승인':'승인 대기'} / ${x.is_active?'운영':'정지'}</td><td><button onclick="approval('${x.id}',${!x.is_approved})">${x.is_approved?'승인 취소':'승인'}</button> <button class="${x.is_active?'danger':'ghost'}" onclick="active('${x.id}',${!x.is_active})">${x.is_active?'정지':'복구'}</button></td></tr>`).join('')}</tbody></table></section><section class="card"><h2>👥 회원 관리</h2><table><thead><tr><th>이름</th><th>이메일</th><th>권한</th><th>가입일</th></tr></thead><tbody>${u.users.map(x=>`<tr><td>${x.name}</td><td>${x.email}</td><td>${x.role}</td><td>${new Date(x.created_at).toLocaleDateString()}</td></tr>`).join('')}</tbody></table></section>`}catch(err){login('로그인 정보를 확인할 수 없습니다. '+err.message)}}async function approval(id,v){try{await req('/api/admin/shops/'+id+'/approval',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({approved:v})});boot()}catch(e){alert(e.message)}}async function active(id,v){try{await req('/api/admin/shops/'+id+'/active',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({active:v})});boot()}catch(e){alert(e.message)}}function logout(){localStorage.removeItem('mycom_token');localStorage.removeItem('token');token=null;login()}boot();</script></main></body></html>
