<!doctype html><html lang="ko"><head><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css"><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css"><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYCOM 업체 초대가입</title><style>body{margin:0;background:#F4F6F8;font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#16181C}.wrap{max-width:650px;margin:auto;background:#fff;min-height:100vh;padding:28px;box-sizing:border-box}.hero{background:linear-gradient(135deg,#16181C,#1F6FE5);color:white;border-radius:22px;padding:24px;margin-bottom:20px}.hero h1{margin:0 0 8px}.hero p{margin:0;opacity:.86;font-size:13px;line-height:1.6}.ok{display:none;background:#EAF2FE;color:#1558BD;padding:12px;border-radius:12px;font-size:13px;font-weight:800;margin-bottom:14px}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}.field input,.field textarea{width:100%;box-sizing:border-box;padding:13px;border:1px solid #E6E9EE;border-radius:12px;font-size:15px}.section{border-top:1px solid #E6E9EE;margin-top:20px;padding-top:10px}.btn{width:100%;border:0;border-radius:14px;padding:16px;background:#1F6FE5;color:#fff;font-size:16px;font-weight:900;margin-top:20px}.hint{font-size:12px;color:#6B7684;line-height:1.6}.services{display:flex;flex-wrap:wrap;gap:7px}.services label{background:#F4F6F8;padding:9px 11px;border-radius:20px;font-size:12px}</style></head><body><main class="wrap"><section class="hero"><h1><i class="ph ph-storefront"></i> MYCOM 업체 초대가입</h1><p>MYCOM에서 발급한 초대 링크를 받은 컴퓨터 업체만 가입할 수 있습니다.<br>가입 후 관리자 승인 절차를 거쳐 업체 서비스를 이용할 수 있습니다.</p></section><div id="valid" class="ok"><i class="ph ph-check"></i> 유효한 업체 초대 링크입니다.</div><form id="form" style="display:none"><div class="section"><h3><i class="ph ph-user"></i> 대표자 정보</h3><div class="field"><label>대표자/담당자명</label><input id="name" required></div><div class="field"><label>이메일</label><input id="email" type="email" required></div><div class="field"><label>비밀번호</label><input id="password" type="password" minlength="8" required placeholder="8자 이상"></div><div class="field"><label>휴대폰</label><input id="phone" placeholder="010-0000-0000"></div></div><div class="section"><h3>업체 정보</h3><div class="field"><label>업체명</label><input id="shop_name" required></div><div class="field"><label>사업자등록번호</label><input id="business_number" required placeholder="000-00-00000"></div><div class="field"><label>매장 주소</label><div style="display:flex;gap:8px"><input id="address" required readonly placeholder="주소 검색을 눌러 입력하세요" style="flex:1"><button type="button" style="flex:none;white-space:nowrap;border:1px solid #E6E9EE;background:#fff;border-radius:12px;padding:0 14px;font-weight:700" onclick="searchAddress()"><i class="ph ph-magnifying-glass"></i> 주소 검색</button></div></div><div class="field"><label>상세 주소</label><input id="detail_address"></div><div class="field"><div id="gpsStatus" class="hint" style="margin-bottom:8px"><i class="ph-fill ph-map-pin"></i> 주소를 검색하면 좌표가 자동으로 등록되어 고객의 "내 주변" 검색에 노출됩니다.</div><button type="button" style="width:100%;border:0;border-radius:12px;padding:12px;background:#EAF2FE;color:#1558BD;font-weight:800" onclick="setLocation()"><i class="ph-fill ph-crosshair-simple"></i> 매장에서 가입 중이라면 · 현재 위치로 설정</button></div><div class="field"><label>매장 전화번호</label><input id="shop_phone"></div><div class="field"><label><i class="ph ph-chat-circle"></i> 업체 오픈카톡</label><input id="open_kakao_url" type="url" placeholder="https://open.kakao.com/o/xxxxxxxx"></div><div class="field"><label>매장 소개</label><textarea id="description" rows="4"></textarea></div><div class="field"><label>제공 서비스</label><div class="services"><label><input type="checkbox" value="조립PC"> 조립PC</label><label><input type="checkbox" value="PC수리"> PC수리</label><label><input type="checkbox" value="중고매입"> 중고매입</label><label><input type="checkbox" value="출장서비스"> 출장서비스</label><label><input type="checkbox" value="부품판매"> 부품판매</label><label><input type="checkbox" value="게이밍PC"> 게이밍PC</label></div></div></div><p class="hint">가입 후 관리자가 업체 정보를 확인하고 승인하면 고객에게 업체가 노출됩니다.</p><button class="btn" id="submit">업체 가입 신청하기</button></form><div id="invalid" style="display:none;text-align:center;padding:30px 10px;color:#D6006C;font-weight:800">이 링크는 유효하지 않거나 만료된 업체 초대 링크입니다.<br><br>MYCOM 관리자에게 새로운 업체 가입 링크를 요청해주세요.</div></main><script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script>const qs=new URLSearchParams(location.search);const invite=qs.get('invite')||'';const valid=!!invite;document.getElementById('valid').style.display=valid?'block':'none';document.getElementById('form').style.display=valid?'block':'none';document.getElementById('invalid').style.display=valid?'none':'block';const q=id=>document.getElementById(id);let capturedLat=null,capturedLng=null;
function gpsMsg(html,color){q('gpsStatus').innerHTML=html;q('gpsStatus').style.color=color}
function searchAddress(){if(!window.daum||!daum.Postcode)return alert('주소 검색을 불러오지 못했습니다. 새로고침 후 다시 시도해주세요.');new daum.Postcode({oncomplete:function(data){const addr=data.roadAddress||data.jibunAddress;q('address').value=addr;q('detail_address').focus();geocode(addr)}}).open()}
async function geocode(addr){
  gpsMsg('<i class="ph ph-spinner"></i> 주소의 좌표를 찾는 중…','#6B7684');
  let lat=null,lng=null;
  try{
    const r=await fetch('https://maps.googleapis.com/maps/api/geocode/json?language=ko&region=KR&key=AIzaSyC3qZKr3d3vitWcjXMXTeUaJTFJ7L0ViQU&address='+encodeURIComponent(addr));
    const d=await r.json();
    if(d.status==='OK'&&d.results[0]){lat=d.results[0].geometry.location.lat;lng=d.results[0].geometry.location.lng}
  }catch(e){}
  if(lat==null){
    try{
      const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=kr&q='+encodeURIComponent(addr),{headers:{'Accept-Language':'ko'}});
      const d=await r.json();
      if(Array.isArray(d)&&d.length){lat=parseFloat(d[0].lat);lng=parseFloat(d[0].lon)}
    }catch(e){}
  }
  if(lat==null){gpsMsg('<i class="ph-fill ph-warning-circle"></i> 주소로 좌표를 찾지 못했습니다. 매장에서 아래 버튼으로 현재 위치를 등록해주세요.','#C05621');return}
  capturedLat=lat;capturedLng=lng;gpsMsg('<i class="ph-fill ph-check-circle"></i> 좌표가 등록되었습니다 ('+lat.toFixed(5)+', '+lng.toFixed(5)+')','#1558BD');
}
function setLocation(){if(!('geolocation' in navigator))return alert('이 브라우저에서는 위치 확인을 지원하지 않습니다.');navigator.geolocation.getCurrentPosition(pos=>{capturedLat=pos.coords.latitude;capturedLng=pos.coords.longitude;gpsMsg('<i class="ph-fill ph-check-circle"></i> 현재 위치가 저장되었습니다. 가입 완료 시 함께 등록됩니다.','#1558BD')},()=>{alert('위치 권한이 거부되었거나 위치를 확인할 수 없습니다. 가입은 계속 진행하실 수 있고, 나중에 매장 관리 화면에서 설정할 수 있습니다.')},{enableHighAccuracy:true,timeout:8000})}
q('form').onsubmit=async e=>{e.preventDefault();q('submit').disabled=true;const body={invite_code:invite,name:q('name').value.trim(),email:q('email').value.trim(),password:q('password').value,phone:q('phone').value.trim(),shop_name:q('shop_name').value.trim(),business_number:q('business_number').value.trim(),address:q('address').value.trim(),detail_address:q('detail_address').value.trim(),shop_phone:q('shop_phone').value.trim(),open_kakao_url:q('open_kakao_url').value.trim(),description:q('description').value.trim(),services:[...document.querySelectorAll('.services input:checked')].map(x=>x.value)};if(capturedLat!=null&&capturedLng!=null){body.latitude=capturedLat;body.longitude=capturedLng}try{const r=await fetch('/api/auth/register-shop',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error||'업체 가입 실패');if(d.token)localStorage.setItem('mycom_token',d.token);if(d.user)localStorage.setItem('mycom_user',JSON.stringify(d.user));alert(d.message||'업체 가입 신청 완료');location.href='/partner.html'}catch(err){alert(err.message)}finally{q('submit').disabled=false}};</script></body></html>
