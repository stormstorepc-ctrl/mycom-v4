<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYCOM | 설정</title><style>body{margin:0;background:#f6f7f8;color:#20252b;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}.wrap{max-width:640px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:20px;margin:10px 0}.top{display:flex;gap:12px;align-items:center}.back{border:0;border-radius:12px;padding:10px 14px}.input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ddd;border-radius:12px;margin:6px 0 12px}.primary,.danger{border:0;border-radius:12px;padding:13px;width:100%;font-weight:800}.primary{background:#12b886;color:#fff}.danger{background:#fff0f0;color:#c92a2a;margin-top:10px}</style></head><body><main class="wrap"><div class="top"><button class="back" onclick="history.back()">←</button><h2>⚙️ 설정</h2></div><section class="card"><label>이름</label><input id="name" class="input"><label>전화번호</label><input id="phone" class="input"><button class="primary" onclick="save()">변경사항 저장</button><p id="msg"></p></section><section class="card"><button class="danger" onclick="logout()">로그아웃</button></section></main><script>const token=localStorage.getItem('mycom_token')||localStorage.getItem('token');async function load(){if(!token){location.href='/';return}const r=await fetch('/api/auth/me',{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok){location.href='/';return}name.value=d.user.name||'';phone.value=d.user.phone||''}async function save(){const r=await fetch('/api/auth/profile',{method:'PUT',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({name:name.value,phone:phone.value})});const d=await r.json();msg.textContent=r.ok?'저장되었습니다.':(d.error||'저장 실패');}function logout(){localStorage.removeItem('mycom_token');localStorage.removeItem('token');location.href='/'}load();</script></body></html>
