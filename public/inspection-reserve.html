<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYCOM | 중고 PC 검수 예약</title><style>body{margin:0;background:#f6f7f8;color:#20252b;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}.wrap{max-width:720px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 5px 18px #00000008}.top{display:flex;gap:12px;align-items:center}.back{border:0;background:#fff;border-radius:12px;padding:10px 13px;font-weight:800}.name{font-size:17px;font-weight:900}.muted{color:#727b84;font-size:13px;line-height:1.6}.btn{width:100%;border:0;border-radius:12px;padding:13px;margin-top:10px;background:#12b886;color:#fff;font-weight:900}.empty{text-align:center;padding:40px 15px}</style></head><body><main class="wrap"><div class="top"><button class="back" onclick="history.back()">←</button><div><h2 style="margin:0">중고 PC 검수 예약</h2><div class="muted">내 주변 검수 가능 매장을 찾습니다.</div></div></div><div id="status" class="card muted">📍 현재 위치를 확인하는 중입니다...</div><div id="shops"></div></main><script>const statusEl=document.getElementById('status'),shopsEl=document.getElementById('shops');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function fetchShops(latitude,longitude){let u='/api/shops?radius=30&sort=distance';if(latitude!=null&&longitude!=null)u+='&latitude='+encodeURIComponent(latitude)+'&longitude='+encodeURIComponent(longitude);const r=await fetch(u,{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'매장 조회에 실패했습니다.');return d.shops||[]}function render(a,located){statusEl.innerHTML=located?'📍 현재 위치 기준 가까운 매장':'📍 위치 권한이 없어 승인 업체를 표시합니다.';if(!a.length){shopsEl.innerHTML='<div class="card empty"><h3>예약 가능한 매장이 없습니다.</h3><p class="muted">현재 승인된 MYCOM 업체가 없거나 반경 30km 안에 없습니다.</p></div>';return}shopsEl.innerHTML=a.map(s=>'<div class="card"><div class="name">🏪 '+esc(s.shop_name)+'</div><div class="muted">⭐ '+Number(s.avg_rating||0).toFixed(1)+' · 리뷰 '+(s.review_count||0)+'개<br>📍 '+(s.distance!=null?Number(s.distance).toFixed(1)+'km · ':'')+esc(s.address||'')+'<br>☎️ '+esc(s.phone||'')+'</div><button class="btn" onclick="location.href=\'/reserve.html?shop='+encodeURIComponent(s.id)+'&service=중고검수\'">검수 예약하기</button></div>').join('')}async function load(){try{if(!navigator.geolocation){render(await fetchShops(),false);return}navigator.geolocation.getCurrentPosition(async p=>{try{render(await fetchShops(p.coords.latitude,p.coords.longitude),true)}catch(e){statusEl.textContent=e.message}},async()=>{try{render(await fetchShops(),false)}catch(e){statusEl.textContent=e.message}} ,{enableHighAccuracy:true,timeout:8000,maximumAge:300000})}catch(e){statusEl.textContent=e.message}}load();</script></body></html>
