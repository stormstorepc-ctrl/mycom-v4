<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYCOM | 중고 PC 검수 예약</title><style>body{margin:0;background:#f6f7f8;color:#20252b;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}.top{display:flex;align-items:center;gap:10px}.back{border:0;background:#fff;border-radius:12px;padding:10px 13px;font-weight:800}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 5px 18px #00000008}.shop{display:flex;gap:13px;align-items:center}.icon{width:62px;height:62px;border-radius:15px;background:#e6fcf5;display:grid;place-items:center;font-size:30px}.name{font-size:17px;font-weight:900}.muted{color:#78838d;font-size:13px;line-height:1.55}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:900}.primary{background:#12b886;color:#fff}.full{width:100%;margin-top:10px}.empty{text-align:center;padding:45px 18px}.loading{padding:30px;text-align:center}</style></head><body><main class="wrap"><header class="top"><button class="back" onclick="history.length>1?history.back():location.href='/'">←</button><div><h2 style="margin:0">중고 PC 검수 예약</h2><div class="muted">내 주변에서 검수 가능한 MYCOM 업체를 찾습니다.</div></div></header><div id="app" class="loading">📍 현재 위치를 확인하고 가까운 매장을 찾는 중...</div></main><script>const app=document.getElementById('app'),params=new URLSearchParams(location.search),preShop=params.get('shop');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function geo(){return new Promise((resolve,reject)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>resolve(p.coords),reject,{enableHighAccuracy:true,timeout:8000,maximumAge:300000}):reject(Error('위치 정보를 지원하지 않는 브라우저입니다.')))}async function load(){try{let url='/api/shops?service=중고검수';if(preShop)url='/api/shops?service=중고검수&shop_id='+encodeURIComponent(preShop);try{const c=await geo();url+=(url.includes('?')?'&':'?')+'lat='+c.latitude+'&lng='+c.longitude}catch(e){}const r=await fetch(url,{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'매장 목록을 불러오지 못했습니다.');let shops=d.shops||[];if(preShop)shops=shops.filter(s=>String(s.id)===String(preShop));if(!shops.length){app.innerHTML='<div class="card empty">🏪<h3>주변에 예약 가능한 매장이 없습니다.</h3><p class="muted">승인된 MYCOM 업체가 등록되면 이곳에 표시됩니다.</p><button class="btn primary" onclick="location.href=\'/\'">다른 매장 찾기</button></div>';return}app.innerHTML='<div class="muted" style="margin:14px 2px">검수 가능한 매장 '+shops.length+'곳</div>'+shops.map(s=>`<article class="card"><div class="shop"><div class="icon">🖥️</div><div><div class="name">${esc(s.shop_name)}</div><div class="muted">⭐ ${Number(s.avg_rating||s.rating||0).toFixed(1)} · 후기 ${s.review_count||0}개<br>📍 ${esc(s.distance!=null?Number(s.distance).toFixed(1)+'km · ':'')}${esc(s.address||'')}</div></div></div><button class="btn primary full" onclick="location.href='/reserve.html?shop=${encodeURIComponent(s.id)}&service=중고검수'">🗓️ 이 매장에서 검수 예약</button></article>`).join('')}catch(e){app.innerHTML=`<div class="card empty">⚠️<h3>매장 목록을 불러오지 못했습니다.</h3><p class="muted">${esc(e.message)}</p><button class="btn primary" onclick="load()">다시 찾기</button></div>`}}load();</script></body></html>
