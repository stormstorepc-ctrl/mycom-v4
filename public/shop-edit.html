<!doctype html><html lang="ko"><head><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css"><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css"><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYCOM | 매장 정보 수정</title><style>body{margin:0;background:#F4F6F8;color:#16181C;font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}.wrap{max-width:760px;margin:auto;padding:20px}.top{background:#fff;padding:18px;border-radius:18px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:800;color:#1F6FE5}.card{background:#fff;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 4px 20px #16181C0a}label{display:block;font-weight:700;margin:14px 0 7px}.input,textarea{width:100%;box-sizing:border-box;border:1px solid #E6E9EE;border-radius:12px;padding:12px;background:#F4F6F8}textarea{min-height:100px;resize:vertical}button{border:0;border-radius:10px;padding:11px 15px;background:#1F6FE5;color:#fff;font-weight:700;cursor:pointer}.ghost{background:#EAF2FE;color:#1558BD}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.photo{border:2px dashed #E6E9EE;border-radius:14px;min-height:150px;position:relative;overflow:hidden;background:#F4F6F8}.photo img{width:100%;height:150px;object-fit:cover}.del{position:absolute;right:6px;top:6px;background:#D6006C;padding:6px 9px}.cover{position:absolute;left:6px;bottom:6px;background:#16181C;padding:6px 9px}.hint{font-size:12px;color:#6B7684;line-height:1.5}.status{padding:10px 12px;background:#EAF2FE;border-radius:10px;margin-bottom:14px}@media(max-width:600px){.photos{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="wrap"><header class="top"><div><div class="brand">MYCOM PARTNER</div><div><i class="ph ph-storefront"></i> 매장 정보 수정</div></div><button class="ghost" onclick="location.href='/partner.html'">← 업체 관리자</button></header><div id="status" class="status">내 매장 정보를 불러오는 중...</div><section class="card"><h2>기본 매장정보</h2><label>매장명</label><input id="shop_name" class="input"><label>연락처</label><input id="phone" class="input"><label>주소</label><div style="display:flex;gap:8px"><input id="address" class="input" placeholder="주소 검색을 눌러 입력하세요" readonly style="flex:1"><button type="button" class="ghost" style="flex:none;white-space:nowrap" onclick="searchAddress()"><i class="ph ph-magnifying-glass"></i> 주소 검색</button></div><label>상세주소</label><input id="detail_address" class="input"><div id="gpsStatus" class="hint" style="margin:10px 0"></div><p><button type="button" class="ghost" onclick="setLocation()"><i class="ph-fill ph-map-pin"></i> 매장에서 현재 위치로 설정</button></p><label>오픈카톡 링크</label><input id="open_kakao_url" class="input" placeholder="https://open.kakao.com/o/..."><label>매장 소개</label><textarea id="description"></textarea><label>영업시간</label><input id="business_hours" class="input"><label>휴무일</label><input id="closed_days" class="input"><label>간단 소개</label><input id="short_description" class="input"><label>서비스 (쉼표로 구분)</label><input id="services" class="input" placeholder="조립PC, 수리, 출장, 중고PC"><p><button type="button" onclick="saveInfo()">정보 저장</button></p></section><section class="card"><h2><i class="ph ph-camera"></i> 매장 사진</h2><p class="hint">정면·내부·간판 등 실제 매장 사진을 등록하세요. 최대 10장, 사진 1장당 8MB 이하입니다.</p><div id="photos" class="photos"></div><p><input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp" multiple></p><button type="button" onclick="uploadPhotos()">사진 등록</button></section></main><script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script><script src="/shop-edit.js?v=20260908"></script><script>setTimeout(()=>{fetch('/api/auth/me?ts='+Date.now(),{cache:'no-store',headers:{Authorization:'Bearer '+(localStorage.getItem('mycom_token')||localStorage.getItem('token')||'')}}).then(r=>r.json()).then(x=>{const s=document.getElementById('status');if(x.user?.role==='shop')s.innerHTML=x.user.is_approved?'<i class="ph-fill ph-check-circle" style="color:#1F6FE5"></i> 관리자 승인 완료':'<i class="ph-fill ph-clock" style="color:#B26A00"></i> 관리자 승인 대기 중'}).catch(()=>{})},300)</script></body></html>
