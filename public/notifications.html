<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12b886"><title>MYCOM 알림</title><style>body{margin:0;background:#f5f7f8;color:#202a33;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:760px;min-height:100vh;margin:auto;background:#f5f7f8;padding-bottom:30px}.top{position:sticky;top:0;z-index:2;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);padding:14px 16px;border-bottom:1px solid #edf0f2;display:flex;align-items:center;gap:10px}.back,.all{border:0;border-radius:11px;background:#f1f3f5;padding:9px 11px;font-weight:800}.top h2{font-size:19px;margin:0;flex:1}.list{padding:10px 14px}.item{display:block;background:#fff;border-radius:16px;padding:15px;margin:9px 0;box-shadow:0 4px 15px #00000008;text-decoration:none;color:inherit}.item.unread{border-left:4px solid #12b886;padding-left:11px}.title{font-weight:900}.msg{font-size:13px;color:#66717c;line-height:1.55;margin-top:6px}.time{font-size:11px;color:#9aa2a9;margin-top:8px}.empty{text-align:center;padding:80px 20px;color:#7b8790}.badge{font-size:11px;color:#087f5b;background:#e6fcf5;border-radius:999px;padding:4px 7px;margin-left:6px}</style></head><body><main class="wrap"><header class="top"><button class="back" onclick="history.length>1?history.back():location.href='/'">←</button><h2>알림 <span id="badge"></span></h2><button class="all" id="readAll">모두 읽음</button></header><section id="list" class="list"><div class="empty">불러오는 중...</div></section></main><script>const token=localStorage.getItem('mycom_token')||localStorage.getItem('token');const auth={Authorization:'Bearer '+token};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){if(!token){location.href='/index.html';return}try{const r=await fetch('/api/notifications/my',{headers:auth,cache:'no-store'});const d=await r.json();if(r.status===401){location.href='/index.html';return}if(!r.ok)throw Error(d.error);document.getElementById('badge').innerHTML=d.unread_count?`<span class="badge">${d.unread_count}</span>`:'';const items=d.notifications||[];document.getElementById('list').innerHTML=items.length?items.map(n=>`<a class="item ${n.is_read?'':'unread'}" href="${n.link||'#'}" data-id="${n.id}"><div class="title">${esc(n.title)}</div><div class="msg">${esc(n.message)}</div><div class="time">${n.created_at?new Date(n.created_at).toLocaleString('ko-KR'):''}</div></a>`).join(''):'<div class="empty">🔔<br><br>새로운 알림이 없습니다.</div>';document.querySelectorAll('.item[data-id]').forEach(el=>el.addEventListener('click',async()=>{if(el.classList.contains('unread')){fetch('/api/notifications/'+el.dataset.id+'/read',{method:'PATCH',headers:auth}).catch(()=>{})}}))}catch(e){document.getElementById('list').innerHTML='<div class="empty">알림을 불러오지 못했습니다.<br><br><button class="all" onclick="load()">다시 시도</button></div>'}}document.getElementById('readAll').onclick=async()=>{await fetch('/api/notifications/read-all',{method:'PATCH',headers:auth});load()};load();</script></body></html>
