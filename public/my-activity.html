<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12b886"><title>MYCOM 내 활동</title><style>body{margin:0;background:#f5f7f8;color:#202a33;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 14px 60px}.top{display:flex;align-items:center;gap:12px}.back,.notify{border:0;background:#fff;border-radius:12px;padding:10px 12px;font-weight:800}.top-main{flex:1}.tabs{display:flex;gap:8px;overflow:auto;margin:18px 0}.tab{white-space:nowrap;border:0;border-radius:999px;padding:10px 14px;background:#e9eef0;font-weight:800}.tab.on{background:#12b886;color:#fff}.card{background:#fff;border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 5px 18px #00000008}.muted{color:#7a8590;font-size:13px;line-height:1.55}.badge{display:inline-block;border-radius:999px;padding:5px 8px;background:#e6fcf5;color:#087f5b;font-size:11px;font-weight:900}.price{font-size:18px;font-weight:900}.empty{padding:55px 18px;text-align:center}.primary{border:0;border-radius:12px;padding:12px 16px;background:#12b886;color:#fff;font-weight:900}.danger{background:#fff0f0;color:#c92a2a}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.room{cursor:pointer;text-decoration:none;color:inherit}</style><body><main class="wrap"><div class="top"><button class="back" onclick="history.length>1?history.back():location.href='/index.html'">←</button><div class="top-main"><h2 style="margin:0">내 활동</h2><div class="muted">견적·입찰·예약·상담을 한 곳에서 확인하세요.</div></div><button class="notify" onclick="location.href='/notifications.html'">🔔</button></div><nav class="tabs"><button class="tab" data-tab="bids">🔥 진행 중인 입찰</button><button class="tab" data-tab="quotes">📋 내 견적</button><button class="tab" data-tab="reservations">🗓️ 예약 내역</button><button class="tab" data-tab="chats">💬 상담 내역</button></nav><div id="app"><div class="card muted">불러오는 중...</div></div></main><script>const token=localStorage.getItem('mycom_token')||localStorage.getItem('token');const params=new URLSearchParams(location.search);let tab=params.get('tab')||'quotes';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const auth={Authorization:'Bearer '+token};function login(){alert('로그인 후 이용할 수 있습니다.');location.href='/index.html'}function money(n){return n==null?'가격 제안 없음':Number(n).toLocaleString()+'원'}function fmtDate(s){const t=String(s||'').slice(0,10);const d=new Date(t+'T00:00:00');if(isNaN(d))return t;const w=['일','월','화','수','목','금','토'];return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+w[d.getDay()]+')'}function svcLabel(s){s=String(s||'');if(s.includes('조립'))return'🔧 조립대행';if(s.includes('중고')||s.includes('검수')||s.includes('매입'))return'💰 중고검수·매입';if(s.includes('출장'))return'🚗 출장 서비스';if(s.includes('수리')||s.includes('점검'))return'🛠️ 수리/점검';if(s.includes('업그레이드'))return'⬆️ 업그레이드';if(s.includes('방문')||s.includes('상담'))return'🏠 방문예약';return'🗓️ '+s}function statChip(st){const m={pending:['⏳ 수락 대기 중','#fff3bf','#946200'],confirmed:['✅ 예약 확정','#e6fcf5','#087f5b'],completed:['🎉 완료됨','#e7f5ff','#1864ab'],cancelled:['❌ 취소됨','#ffe3e3','#c92a2a']};const v=m[st]||[st,'#eee','#555'];return `<span style="border-radius:999px;padding:5px 9px;background:${v[1]};color:${v[2]};font-size:11px;font-weight:900;white-space:nowrap">${v[0]}</span>`}function setTab(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));history.replaceState(null,'','?tab='+tab);load()}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;setTab()});async function json(url,opt={}){const r=await fetch(url,{...opt,headers:{...auth,...(opt.headers||{})}});const d=await r.json().catch(()=>({error:'서버 응답을 읽을 수 없습니다.'}));if(r.status===401){location.href='/index.html';throw Error('로그인이 필요합니다.')}if(!r.ok)throw Error(d.error||'요청 실패');return d}async function load(){if(!token)return login();app.innerHTML='<div class="card muted">불러오는 중...</div>';try{if(tab==='quotes'){const d=await json('/api/quotes/my');const a=(d.quotes||[]).filter(x=>x.status!=='cancelled');app.innerHTML=a.length?a.map(q=>`<article class="card"><div class="row"><b>${esc(q.title)}</b><span class="badge">${esc(q.status||'open')}</span></div><p class="muted">입찰 ${q.bid_count||0}건 · 최저 ${money(q.min_bid)}</p><div class="row" style="margin-top:12px"><button class="primary" style="flex:1" onclick="location.href='/sale-detail.html?id=${encodeURIComponent(q.id)}'">입찰 보기</button><button class="primary danger" onclick="deleteQuote('${q.id}')">🗑️ 삭제</button></div></article>`).join(''):empty('아직 등록한 판매/견적이 없습니다.','PC 판매하기','/sell.html')}else if(tab==='bids'){const d=await json('/api/quotes/my');const a=(d.quotes||[]).filter(x=>x.quote_type==='sell'&&['open','bidding','selected'].includes(x.status));app.innerHTML=a.length?a.map(q=>`<article class="card"><div class="row"><b>${esc(q.title)}</b><span class="badge">${esc(q.status||'open')}</span></div><p class="muted">현재 ${q.bid_count||0}개 업체가 참여했습니다.</p><span class="price">최저 제안 ${money(q.min_bid)}</span><div class="row" style="margin-top:12px"><button class="primary" style="flex:1" onclick="location.href='/sale-detail.html?id=${encodeURIComponent(q.id)}'">입찰 보기</button><button class="primary danger" onclick="deleteQuote('${q.id}')">🗑️ 삭제</button></div></article>`).join(''):empty('진행 중인 PC/부품 판매가 없습니다.','PC 판매하기','/sell.html')}else if(tab==='reservations'){const d=await json('/api/reservations/my');const a=d.reservations||[];app.innerHTML=a.length?a.map(r=>`<article class="card"><div class="row"><b>${svcLabel(r.service_type)}</b>${statChip(r.status||'pending')}</div><div style="margin-top:8px;font-weight:800">🏪 ${esc(r.shop_name||'업체')}</div><p class="muted" style="margin:6px 0">📅 ${fmtDate(r.reservation_date)} · ${esc(String(r.reservation_time||'').slice(0,5))}</p><div class="muted">📍 ${esc(r.address||'')}</div>${r.notes?`<div class="muted" style="margin-top:9px;background:#f8f9fa;border-radius:10px;padding:11px;white-space:pre-line">${esc(r.notes)}</div>`:''}${['pending','confirmed'].includes(r.status)?`<button class="primary danger" style="margin-top:12px" onclick="cancelReservation('${r.id}')">예약 취소</button>`:''}</article>`).join(''):empty('예약 내역이 없습니다.','조립대행 의뢰하기','/assembly.html')}else{const d=await json('/api/chat/rooms');const a=d.rooms||[];app.innerHTML=a.length?a.map(r=>`<a class="card room" href="/chat.html?room=${encodeURIComponent(r.id)}"><div class="row"><b>${esc(r.other_party_name)}</b>${Number(r.unread_count)>0?'<span class="badge">새 메시지 '+r.unread_count+'</span>':''}</div><p class="muted">${esc(r.last_message||'아직 메시지가 없습니다.')}</p></a>`).join(''):empty('업체와 진행 중인 상담이 없습니다.','가까운 업체 찾기','/index.html')}}catch(e){app.innerHTML='<div class="empty">'+esc(e.message||'데이터를 불러오지 못했습니다.')+'<br><br><button class="primary" onclick="load()">다시 시도</button></div>'}}function empty(msg,label,url){return `<div class="card empty"><div style="font-size:40px">📭</div><h3>${msg}</h3><p class="muted">필요한 서비스는 MYCOM 홈에서 바로 시작할 수 있습니다.</p><button class="primary" onclick="location.href='${url}'">${label}</button></div>`}async function cancelReservation(id){if(!confirm('예약을 취소할까요?'))return;try{await json('/api/reservations/'+id,{method:'DELETE'});load()}catch(e){alert(e.message)}}async function deleteQuote(id){if(!confirm('이 판매/견적 글을 삭제할까요?'))return;try{await json('/api/quotes/'+encodeURIComponent(id),{method:'DELETE'});alert('삭제되었습니다.')}catch(e){if(confirm('입찰이 달린 글은 완전 삭제가 제한될 수 있습니다.\n대신 접수 취소(목록과 배너에서 숨김)로 바꿀까요?')){try{await json('/api/quotes/'+encodeURIComponent(id)+'/status',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'cancelled'})});alert('접수가 취소되었습니다.')}catch(e2){alert(e2.message)}}}load()}setTab();</script></body></html>
