<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYCOM | 예약 관리</title><style>body{margin:0;background:#f6f7f9;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#202124}.wrap{max-width:900px;margin:auto;padding:18px}.top,.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 4px 20px #00000008}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:900;color:#00a878}.row{padding:16px 0;border-bottom:1px solid #eee}.row:last-child{border:0}.name{font-weight:900}.muted{color:#777;font-size:13px;margin-top:5px}.actions{margin-top:10px;display:flex;gap:7px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:9px 12px;background:#00a878;color:#fff;font-weight:800}.cancel{background:#fff0f0;color:#c92a2a}.pending{color:#d9480f}.confirmed{color:#087f5b}.completed{color:#1864ab}@media(max-width:600px){.wrap{padding:12px}}</style></head><body><main class="wrap"><header class="top"><div><div class="brand">MYCOM PARTNER</div><b>📅 예약 관리</b></div><button onclick="location.href='/partner.html'">← 업체관리</button></header><section class="card"><div id="list">불러오는 중...</div></section></main><script>const token=localStorage.getItem('mycom_token')||localStorage.getItem('token');let shopId;async function api(u,o={}){const r=await fetch(u,{...o,headers:{Authorization:'Bearer '+token,...(o.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'요청 실패');return d}async function load(){if(!token){location.href='/partner.html';return}try{const m=await api('/api/auth/me');if(m.user.role!=='shop'||!m.user.shop_id){location.href='/partner.html';return}shopId=m.user.shop_id;const d=await api('/api/reservations/shop/'+shopId);render(d.reservations||[])}catch(e){list.textContent=e.message}}function render(a){list.innerHTML=a.map(r=>`<div class="row"><div class="name">${esc(r.user_name||'고객')} · ${esc(r.service_type||'방문 상담')}</div><div class="muted">📅 ${esc(r.reservation_date||'')} ${esc(r.reservation_time||'')}</div><div class="muted">📞 ${esc(r.user_phone||'미등록')}</div><div class="muted">${esc(r.notes||'요청사항 없음')}</div><div class="actions"><b class="${esc(r.status)}">현재 상태: ${statusText(r.status)}</b>${r.status==='pending'?`<button onclick="change('${r.id}','confirmed')">예약 확정</button>`:''}${r.status==='confirmed'?`<button onclick="change('${r.id}','completed')">방문 완료</button>`:''}${r.status!=='cancelled'&&r.status!=='completed'?`<button class="cancel" onclick="change('${r.id}','cancelled')">예약 취소</button>`:''}</div></div>`).join('')||'<p class="muted">예약 내역이 없습니다.</p>'}function statusText(s){return({pending:'접수 대기',confirmed:'예약 확정',completed:'완료',cancelled:'취소'})[s]||s}async function change(id,status){if(status==='cancelled'&&!confirm('이 예약을 취소할까요?'))return;try{await api('/api/reservations/'+id+'/status',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});load()}catch(e){alert(e.message)}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load();</script></body></html>
