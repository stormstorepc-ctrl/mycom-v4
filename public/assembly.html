<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYCOM | PC 조립 대행 의뢰</title><style>
body{margin:0;background:#f6f7f9;color:#202124;font-family:Pretendard,Arial,sans-serif}
.wrap{max-width:720px;margin:auto;padding-bottom:80px}
.hero{background:linear-gradient(135deg,#17202a,#0b3d33);color:#fff;padding:30px 22px;border-radius:0 0 26px 26px;position:relative;overflow:hidden;min-height:130px}
.hero h1{margin:0;font-size:25px;letter-spacing:-.5px}
.hero p{opacity:.85;font-size:14px;line-height:1.65;margin:10px 0 0}
.hero .tagline{display:inline-block;background:#12b886;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:900;margin-bottom:12px}
.body{padding:20px 16px}
.card{background:#fff;border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:0 5px 20px #0000000b}
.card h3{margin:0 0 12px;font-size:17px}
.svc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.svc div{background:#f6f9f8;border-radius:14px;padding:13px;font-size:13px;font-weight:800;line-height:1.5}
.svc span{display:block;font-size:11px;color:#6b7684;font-weight:600;margin-top:4px}
.step{display:flex;gap:12px;margin:12px 0;font-size:14px;line-height:1.6;align-items:flex-start}
.step .num{flex:none;width:26px;height:26px;border-radius:50%;background:#12b886;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:900}
.step .txt b{color:#087f5b}
.notice{font-size:12px;color:#8a949f;line-height:1.7;background:#f8f9fa;border-radius:14px;padding:14px}
label{display:block;font-weight:800;font-size:13px;margin:14px 0 6px}
.input,select,textarea{width:100%;box-sizing:border-box;border:1px solid #dee2e6;border-radius:12px;padding:13px;font-size:15px;background:#fff;font-family:inherit}
textarea{min-height:90px;resize:vertical}
.shop{display:flex;gap:13px;align-items:center;background:#fff;border-radius:18px;padding:13px;margin-bottom:11px;box-shadow:0 4px 16px #00000009;border:2.5px solid transparent;cursor:pointer;transition:border-color .15s}
.shop.sel{border-color:#12b886;box-shadow:0 6px 20px #12b88622}
.shop .ph{flex:none;width:70px;height:70px;border-radius:14px;background:#eef1f3;overflow:hidden;display:grid;place-items:center;font-size:26px}
.shop .ph img{width:100%;height:100%;object-fit:cover}
.shop .info{flex:1;min-width:0}
.shop .nm{font-weight:900;font-size:15px}
.shop .nm .ck{display:none;color:#12b886}
.shop.sel .ck{display:inline}
.shop .mt{font-size:12px;color:#6b7684;margin-top:3px}
.shop .rt{font-size:12px;color:#f08c00;font-weight:800;margin-top:3px}
.submit{width:100%;padding:17px;border:0;border-radius:16px;background:#12b886;color:#fff;font-weight:900;font-size:17px;cursor:pointer}
.msg{margin-top:10px;font-size:13px;font-weight:800;color:#c92a2a}
.back{border:0;background:#ffffff22;color:#fff;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}
.empty{padding:40px 18px;text-align:center;color:#6b7684;font-size:14px}
.done{text-align:center;padding:14px 4px}
.done .icon{font-size:50px}
.done .sum{background:#f6f9f8;border-radius:14px;padding:14px;margin:14px 0;font-size:14px;line-height:1.8;text-align:left}
.btnrow{display:flex;gap:8px}
.btnrow button{flex:1;border:0;border-radius:12px;padding:13px;font-weight:900;cursor:pointer;font-size:14px}
.btnrow .g{background:#eef7f4;color:#087657}.btnrow .p{background:#12b886;color:#fff}
</style></head><body>
