<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYCOM 판매 입찰</title><style>body{margin:0;background:#f5f7f8;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#202a33}.wrap{max-width:760px;margin:auto;padding:16px}.top{display:flex;gap:10px;align-items:center}.back,button{border:0;border-radius:12px;padding:11px 14px;font-weight:800}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 5px 18px #00000008}.muted{color:#7a8590;font-size:13px;line-height:1.6}.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}.bid{border:1px solid #e9ecef;border-radius:15px;padding:14px;margin-top:10px}.price{font-size:20px;font-weight:900;color:#087f5b}.primary{background:#12b886;color:#fff;width:100%;margin-top:10px}.danger{background:#fff0f0;color:#c92a2a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tag{background:#e6fcf5;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800;display:inline-block}@media(max-width:520px){.photos{grid-template-columns:repeat(3,1fr)}} </style><body><main class="wrap"><div class="top"><button class="back" onclick="history.back()">←</button><div><h2 style="margin:0">입찰 보기</h2><div class="muted">PC·부품 판매에 들어온 업체 입찰입니다.</div></div></div><div id="app" class="card">불러오는 중...</div></main><script>const token=localStorage.getItem('mycom_token')||localStorage.getItem('token');const id=new URLSearchParams(location.search).get('id');const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=n=>n==null?'가격 제안 없음':Number(n).toLocaleString()+'원';async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{Authorization:'Bearer '+token,...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'요청 실패');return d}async function load(){if(!token){app.innerHTML='로그인이 필요합니다.';return}if(!id){app.innerHTML='판매 정보를 찾을 수 없습니다.';return}try{const d=await api('/api/quotes/'+encodeURIComponent(id));const q=d.quote,b=d.bids||[];let desc=q.description||'';let part=null;try{part=JSON.parse(desc)}catch(e){}const imgs=(q.pc_images||[]);app.innerHTML=`<h2>${esc(q.title)}</h2><span class="tag">${q.quote_type==='sell'?(part?'부품 판매':'PC 판매'):'견적'}</span><p class="muted">상태: ${esc(q.status||'open')} · 입찰 ${b.length}건</p>${q.pc_title?`<div class="card"><b>🖥️ ${esc(q.pc_title)}</b><div class="grid muted" style="margin-top:10px"><div>CPU<br><b>${esc(q.cpu)}</b></div><div>GPU<br><b>${esc(q.gpu)}</b></div><div>RAM<br><b>${esc(q.ram)}</b></div><div>저장장치<br><b>${esc(q.storage)}</b></div></div></div>`:''}${part?`<div class="card"><b>🧩 ${esc(part.category)} · ${esc(part.model)}</b><p class="muted">${esc(part.description)}</p></div>`:''}<p class="muted">${esc(part?part.description:q.description)}</p>${imgs.length?`<div class="photos">${imgs.map(x=>`<img src="${esc(x)}">`).join('')}</div>`:''}<h3>🏪 업체 입찰</h3>${b.length?b.map(x=>`<div class="bid"><b>${esc(x.shop_name)}</b><div class="muted">⭐ ${esc(x.rating||'0')} · ${esc(x.address||'')}</div><div class="price">${money(x.amount)}</div><p class="muted">${esc(x.message||'제안 메시지 없음')}</p>${q.status!=='selected'?`<button class="primary" onclick="selectBid('${x.id}')">이 업체 선택하기</button>`:`${x.is_selected?'<span class="tag">선택된 업체</span>':''}`}</div>`).join(''):'<div class="card muted">아직 들어온 입찰이 없습니다. 승인 업체의 입찰을 기다려주세요.</div>'}` }catch(e){app.innerHTML='<div style="text-align:center;padding:30px">'+esc(e.message)+'</div>'}}async function selectBid(bid){if(!confirm('이 업체의 입찰을 선택할까요?'))return;try{await api('/api/quotes/'+encodeURIComponent(id)+'/status',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'selected',selected_bid_id:bid})});alert('업체가 선택되었습니다. 이제 상담을 진행할 수 있습니다.');load()}catch(e){alert(e.message)}}load();</script></body></html>
