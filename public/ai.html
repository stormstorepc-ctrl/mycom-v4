<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYCOM AI 상담</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7f8;font-family:Arial,sans-serif;color:#202124}.app{max-width:760px;margin:auto;min-height:100vh;background:#fff;display:flex;flex-direction:column}.head{padding:20px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;z-index:2}.head b{font-size:22px}.chips{display:flex;gap:8px;overflow:auto;padding:12px 16px}.chips button{white-space:nowrap;border:1px solid #ddd;background:#fff;border-radius:999px;padding:10px 14px}.messages{flex:1;padding:18px;min-height:55vh}.msg{max-width:85%;padding:13px 15px;border-radius:16px;margin:10px 0;white-space:pre-line;line-height:1.55}.ai{background:#f0f3f5}.me{background:#087f5b;color:#fff;margin-left:auto}.expert{background:#fff8e8;border:1px solid #f1d58a}.composer{display:flex;gap:8px;padding:12px;border-top:1px solid #eee;position:sticky;bottom:0;background:#fff}.composer input{flex:1;padding:14px;border:1px solid #ddd;border-radius:12px}.composer button,.connect{border:0;border-radius:12px;background:#087f5b;color:#fff;font-weight:bold;padding:12px 16px}.card{margin:12px 18px;padding:16px;border:1px solid #eee;border-radius:16px;background:#fafafa}.small{font-size:13px;color:#777}</style></head><body><main class="app"><header class="head"><b>🤖 MYCOM AI 상담사</b><div class="small">먼저 AI가 도와드리고, 필요하면 가까운 사장님과 연결해드립니다.</div></header><nav class="chips"><button data-cat="조립대행">🔧 조립대행</button><button data-cat="컴퓨터 견적">💻 컴퓨터 견적</button><button data-cat="방문예약">🏠 방문예약</button><button data-cat="내 컴퓨터 팔기">💰 내 컴퓨터 팔기</button><button data-cat="수리/업그레이드">🛠️ 수리/업그레이드</button></nav><section id="messages" class="messages"></section><section id="expert" class="card" style="display:none"><b>👨‍💼 사장님과 상담하시겠어요?</b><p class="small">현재 위치를 기준으로 가장 가까운 승인 업체를 찾아 MYCOM 채팅으로 연결합니다.</p><button class="connect" onclick="connectExpert()">📍 가까운 사장님 연결하기</button></section><form class="composer" id="form"><input id="input" autocomplete="off" placeholder="궁금한 내용을 입력하세요..."><button>전송</button></form></main><script>const token=localStorage.getItem('mycom_token')||localStorage.getItem('token');let category='general',history=[];const $=id=>document.getElementById(id);function add(text,who='ai'){const d=document.createElement('div');d.className='msg '+(who==='me'?'me':'ai');d.textContent=text;$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight}function auth(){if(!token){alert('로그인이 필요합니다.');location.href='/login.html';return false}return true}document.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{category=b.dataset.cat;input.value=category+' 상담을 받고 싶어요.';input.focus()});add('안녕하세요! 저는 MYCOM AI 상담사입니다.\n조립대행, 컴퓨터 견적, 방문예약, 중고PC 판매, 수리/업그레이드를 먼저 상담해드릴게요.\n\n정확한 가격·재고·방문·실제 매입가가 필요하면 가까운 업체 사장님께 바로 연결할 수 있습니다.');$('form').onsubmit=async e=>{e.preventDefault();if(!auth())return;const message=input.value.trim();if(!message)return;input.value='';add(message,'me');const thinking=document.createElement('div');thinking.className='msg ai';thinking.textContent='🤖 상담 내용을 확인하고 있습니다...';$('messages').appendChild(thinking);try{const r=await fetch('/api/ai/chat',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({message,category,history})});const d=await r.json();thinking.remove();if(!r.ok)throw new Error(d.error||'상담 실패');add(d.response);history.push({role:'user',content:message},{role:'assistant',content:d.response});$('expert').style.display=d.humanRequired?'block':'none'}catch(err){thinking.remove();add('상담 서버와 연결되지 않았습니다. 잠시 후 다시 시도해주세요.')}};async function connectExpert(){if(!auth())return;const btn=document.querySelector('.connect');btn.disabled=true;btn.textContent='📍 위치 확인 중...';navigator.geolocation.getCurrentPosition(async p=>{try{const summary=history.slice(-6).map(x=>x.role+': '+x.content).join('\n');const r=await fetch('/api/ai/connect-expert',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({latitude:p.coords.latitude,longitude:p.coords.longitude,category,summary})});const d=await r.json();if(!r.ok)throw new Error(d.error||'연결 실패');add(`🏪 ${d.shop.shop_name} 사장님에게 연결했습니다.\n📍 약 ${d.shop.distance_km.toFixed(1)}km\n💬 MYCOM 채팅방에서 상담을 이어가세요.`);setTimeout(()=>location.href='/chat.html?room='+d.room.id,700)}catch(e){alert(e.message);btn.disabled=false;btn.textContent='📍 가까운 사장님 연결하기'}},()=>{alert('가까운 업체를 찾으려면 브라우저의 위치 권한을 허용해주세요.');btn.disabled=false;btn.textContent='📍 가까운 사장님 연결하기'},{enableHighAccuracy:true,timeout:10000,maximumAge:60000})}</script></body></html>
