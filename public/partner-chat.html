<!doctype html><html lang="ko"><head><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css"><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css"><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYCOM | 상담 관리</title><style>body{margin:0;background:#F4F6F8;font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif"Noto Sans KR",sans-serif;color:#16181C}.wrap{max-width:760px;margin:auto;padding:18px}.top,.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 4px 20px #16181C08}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:900;color:#1F6FE5}.row{padding:15px 0;border-bottom:1px solid #E6E9EE;cursor:pointer}.row:last-child{border:0}.name{font-weight:900}.muted{color:#6B7684;font-size:13px;margin-top:5px}.badge{float:right;background:#EAF2FE;color:#1558BD;border-radius:99px;padding:5px 8px;font-size:11px;font-weight:800}button{border:0;border-radius:10px;padding:10px 13px;background:#EAF2FE;color:#1558BD;font-weight:800}@media(max-width:600px){.wrap{padding:12px}}</style></head><body><main class="wrap"><header class="top"><div><div class="brand">MYCOM PARTNER</div><b><i class="ph ph-chat-circle"></i> 고객 상담</b></div><button onclick="location.href='/partner.html'">← 업체관리</button></header><section class="card"><div id="list">불러오는 중...</div></section></main><script>const token=localStorage.getItem('mycom_token')||localStorage.getItem('token');async function load(){if(!token){location.href='/partner.html';return}const r=await fetch('/api/chat/rooms',{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok){list.textContent=d.error||'상담 목록을 불러오지 못했습니다.';return}list.innerHTML=(d.rooms||[]).map(x=>`<div class="row" onclick="location.href='/chat.html?room=${encodeURIComponent(x.id)}'"><span class="badge">${Number(x.unread_count||0)>0?x.unread_count+'개 읽지 않음':'상담'}</span><div class="name">${esc(x.other_party_name||'고객')}</div><div class="muted">${esc(x.last_message||'새 상담입니다.')}</div><div class="muted">${x.last_message_time?new Date(x.last_message_time).toLocaleString('ko-KR'):''}</div></div>`).join('')||'<p class="muted">아직 고객 상담이 없습니다.</p>'}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load();</script></body></html>
