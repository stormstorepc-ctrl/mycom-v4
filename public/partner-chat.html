<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYCOM | 상담 관리</title><style>body{margin:0;background:#f6f7f9;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#202124}.wrap{max-width:760px;margin:auto;padding:18px}.top,.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 4px 20px #00000008}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:900;color:#00a878}.row{padding:15px 0;border-bottom:1px solid #eee;cursor:pointer}.row:last-child{border:0}.name{font-weight:900}.muted{color:#777;font-size:13px;margin-top:5px}.badge{float:right;background:#e6fcf5;color:#087f5b;border-radius:99px;padding:5px 8px;font-size:11px;font-weight:800}button{border:0;border-radius:10px;padding:10px 13px;background:#eef7f4;color:#087657;font-weight:800}@media(max-width:600px){.wrap{padding:12px}}</style></head><body><main class="wrap"><header class="top"><div><div class="brand">MYCOM PARTNER</div><b>💬 고객 상담</b></div><button onclick="location.href='/partner.html'">← 업체관리</button></header><section class="card"><div id="list">불러오는 중...</div></section></main><script>const token=localStorage.getItem('mycom_token')||localStorage.getItem('token');async function load(){if(!token){location.href='/partner.html';return}const r=await fetch('/api/chat/rooms',{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok){list.textContent=d.error||'상담 목록을 불러오지 못했습니다.';return}list.innerHTML=(d.rooms||[]).map(x=>`<div class="row" onclick="location.href='/chat.html?room=${encodeURIComponent(x.id)}'"><span class="badge">${Number(x.unread_count||0)>0?x.unread_count+'개 읽지 않음':'상담'}</span><div class="name">${esc(x.other_party_name||'고객')}</div><div class="muted">${esc(x.last_message||'새 상담입니다.')}</div><div class="muted">${x.last_message_time?new Date(x.last_message_time).toLocaleString('ko-KR'):''}</div></div>`).join('')||'<p class="muted">아직 고객 상담이 없습니다.</p>'}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load();</script></body></html>
