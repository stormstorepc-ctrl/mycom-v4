<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYCOM 상담</title><style>body{margin:0;background:#F4F6F8;font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif"Noto Sans KR",sans-serif;color:#16181C}.wrap{max-width:760px;height:100vh;margin:auto;display:flex;flex-direction:column;background:#fff}.top{padding:15px;border-bottom:1px solid #E6E9EE;display:flex;gap:12px;align-items:center}.back{border:0;background:#F4F6F8;border-radius:10px;padding:8px 10px}.msgs{flex:1;overflow:auto;padding:16px;background:#F4F6F8}.msg{max-width:78%;padding:11px 13px;border-radius:15px;margin:7px 0;white-space:pre-wrap;line-height:1.45}.mine{margin-left:auto;background:#EAF2FE}.other{background:#fff;box-shadow:0 2px 8px #16181C08}.time{font-size:10px;color:#6B7684;margin-top:4px}.form{display:flex;gap:8px;padding:12px;border-top:1px solid #E6E9EE}.form input{flex:1;border:1px solid #E6E9EE;border-radius:12px;padding:12px;font:inherit}.send{border:0;border-radius:12px;background:#1F6FE5;color:#fff;font-weight:900;padding:0 16px}</style><body><main class="wrap"><header class="top"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css"><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css"><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css"><button class="back" onclick="history.back()">←</button><div><b id="title">MYCOM 상담</b><div id="status" style="font-size:11px;color:#6B7684">연결 중...</div></div></header><div id="msgs" class="msgs"></div><form id="form" class="form"><input id="text" maxlength="4000" placeholder="메시지를 입력하세요." autocomplete="off"><button class="send">전송</button></form></main><script>const room=new URLSearchParams(location.search).get('room');const token=localStorage.getItem('mycom_token')||localStorage.getItem('token');const auth={Authorization:'Bearer '+token};let me=null,last='';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function init(){if(!room||!token){location.href='/index.html';return}try{const r=await fetch('/api/auth/me',{headers:auth});const d=await r.json();if(!r.ok)throw Error();me=d.user;await load(true);setInterval(()=>load(false),5000)}catch(e){status.textContent='상담방에 접근할 수 없습니다.'}}async function load(force){const r=await fetch('/api/chat/rooms/'+encodeURIComponent(room)+'/messages',{headers:auth});const d=await r.json();if(!r.ok){status.textContent=d.error||'오류';return}status.textContent='상담 연결됨';const key=JSON.stringify(d.messages.map(x=>[x.id,x.updated_at]));if(!force&&key===last)return;last=key;msgs.innerHTML=d.messages.map(m=>`<div class="msg ${m.sender_id===me.id?'mine':'other'}">${esc(m.message)}<div class="time">${m.created_at?new Date(m.created_at).toLocaleString('ko-KR'):''}</div></div>`).join('')||'<p style="color:#6B7684;text-align:center">상담을 시작해보세요.</p>';if(force)msgs.scrollTop=msgs.scrollHeight}form.onsubmit=async e=>{e.preventDefault();const message=text.value.trim();if(!message)return;const r=await fetch('/api/chat/rooms/'+encodeURIComponent(room)+'/messages',{method:'POST',headers:{...auth,'Content-Type':'application/json'},body:JSON.stringify({message})});const d=await r.json();if(!r.ok)return alert(d.error||'전송 실패');text.value='';await load(true)};init();</script></body></html>
