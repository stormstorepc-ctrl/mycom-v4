<!doctype html><html lang="ko"><head><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css"><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css"><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYCOM | 컴퓨터 사양 자동 체크</title><style>
body{margin:0;background:#F4F6F8;color:#16181C;font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
.wrap{max-width:640px;margin:auto;padding:20px}
.top{background:#fff;padding:18px;border-radius:18px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:20px;font-weight:800;color:#1F6FE5}
.card{background:#fff;border-radius:18px;padding:24px 20px;text-align:center;box-shadow:0 4px 20px #16181C0a}
.icon{font-size:48px;margin-bottom:10px}
h2{margin:0 0 12px}
p{color:#6B7684;line-height:1.7;font-size:15px}
.badge{display:inline-block;margin-top:14px;padding:8px 14px;border-radius:999px;background:#EAF2FE;color:#1558BD;font-weight:700;font-size:13px}
button.ghost{border:0;border-radius:10px;padding:11px 15px;background:#EAF2FE;color:#1558BD;font-weight:700;cursor:pointer;font-size:14px}
</style></head><body>
<main class="wrap">
<header class="top"><div><div class="brand">MYCOM</div><div><i class="ph ph-desktop-tower"></i> 컴퓨터 사양 자동 체크</div></div><button class="ghost" onclick="history.back()">← 뒤로</button></header>
<section class="card">
<div class="icon"><i class="ph ph-desktop-tower"></i></div>
<h2>PC에서만 이용할 수 있어요</h2>
<p>컴퓨터 사양 자동 체크 기능은 MYCOM 홈페이지에 <b>PC(데스크톱)로 접속</b>했을 때만 사용할 수 있습니다.<br><br>모바일에서는 현재 이용하실 수 없으며, 해당 기능은 추후 업데이트를 통해 모바일에서도 제공될 예정입니다.</p>
<div class="badge"><i class="ph ph-calendar-blank"></i> 추후 업데이트 예정</div>
</section>
</main>
</body></html>
