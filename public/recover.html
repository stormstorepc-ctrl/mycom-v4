<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYCOM 계정 찾기</title><style>body{margin:0;background:#f6f7f9;font-family:Arial,sans-serif;color:#222}.box{max-width:520px;margin:auto;min-height:100vh;background:#fff;padding:28px;box-sizing:border-box}.tabs{display:flex;gap:8px;margin:20px 0}.tabs button{flex:1}.tab{display:none}.tab.on{display:block}input{width:100%;box-sizing:border-box;padding:14px;margin:7px 0;border:1px solid #ddd;border-radius:10px}button{padding:13px 16px;border:0;border-radius:10px;background:#00a878;color:#fff;font-weight:bold;cursor:pointer}.secondary{background:#edf6f2;color:#087657}.result{margin-top:12px;padding:14px;background:#f5f7f6;border-radius:10px;white-space:pre-line}.hidden{display:none}</style><main class="box"><h1>계정 찾기</h1><p>일반 고객과 컴퓨터 업체 모두 이용할 수 있습니다.</p><div class="tabs"><button id="idTab">아이디 찾기</button><button class="secondary" id="pwTab">비밀번호 재설정</button></div><section id="idBox" class="tab on"><input id="idName" placeholder="이름 또는 담당자명"><input id="idPhone" placeholder="휴대폰 번호"><button onclick="findId()">아이디 찾기</button><div id="idResult" class="result hidden"></div></section><section id="pwBox" class="tab"><input id="pwEmail" type="email" placeholder="가입 이메일"><input id="pwName" placeholder="이름 또는 담당자명"><input id="pwPhone" placeholder="휴대폰 번호"><input id="pwBiz" placeholder="사업자등록번호 (업체만, 선택)"><button onclick="verify()">계정 확인</button><div id="newPwArea" class="hidden"><input id="newPw" type="password" minlength="8" placeholder="새 비밀번호 (8자 이상)"><button onclick="resetPw()">새 비밀번호 저장</button></div><div id="pwResult" class="result hidden"></div></section><p><button class="secondary" onclick="location.href='/'">MYCOM 메인</button></p></main><script>let resetToken='';const $=id=>document.getElementById(id);$('idTab').onclick=()=>{idBox.className='tab on';pwBox.className='tab'};$('pwTab').onclick=()=>{pwBox.className='tab on';idBox.className='tab'};async function post(url,data){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw new Error(d.error||'처리 실패');return d}function out(id,msg){const e=$(id);e.textContent=msg;e.classList.remove('hidden')}async function findId(){try{const d=await post('/api/auth/find-id',{name:idName.value.trim(),phone:idPhone.value.trim()});out('idResult','찾은 아이디: '+d.email+'\n계정 유형: '+(d.role==='shop'?'컴퓨터 업체':'일반 고객'))}catch(e){out('idResult',e.message)}}async function verify(){try{const d=await post('/api/auth/verify-account',{email:pwEmail.value.trim(),name:pwName.value.trim(),phone:pwPhone.value.trim()||null,business_number:pwBiz.value.trim()||null});resetToken=d.reset_token;newPwArea.classList.remove('hidden');out('pwResult','계정이 확인되었습니다. 15분 안에 새 비밀번호를 설정해주세요.')}catch(e){out('pwResult',e.message)}}async function resetPw(){try{const d=await post('/api/auth/reset-password',{reset_token:resetToken,new_password:newPw.value});out('pwResult',d.message);newPwArea.classList.add('hidden');setTimeout(()=>location.href='/',1200)}catch(e){out('pwResult',e.message)}}</script>
