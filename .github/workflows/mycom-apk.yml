name: MYCOM APK Build
on:
  workflow_dispatch:
  push:
    branches: [apk-v2]
    paths: ['android/**','.github/workflows/mycom-apk.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Build AAB
        working-directory: android
        run: gradle bundleDebug --no-daemon
      - name: Upload MYCOM files
        uses: actions/upload-artifact@v4
        with:
          name: MYCOM-Android-4.0.1
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/debug/app-debug.aab
